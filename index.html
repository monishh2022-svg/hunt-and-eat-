<script>
/* =====================================================================
   STEP 1 (OPTIONAL BUT RECOMMENDED): PASTE YOUR FIREBASE CONFIG HERE
   ---------------------------------------------------------------------
   Get it free at https://console.firebase.google.com
   (Create project -> Firestore Database -> Project settings -> Web app)
   It looks like:  { apiKey: "...", authDomain: "...", projectId: "..." }
   With Firebase: customer orders sync to the admin panel automatically.
   Without it (null): DEMO MODE — data saves only on each visitor's own
   device, and customer orders reach you via the WhatsApp button instead.
===================================================================== */
const FIREBASE_CONFIG = null;

/* ============ PLAN B: REALTIME DATABASE (always free) ============
   If Firestore asks for billing, use Firebase "Realtime Database"
   instead. Create it (Build -> Realtime Database), copy its URL
   (looks like https://hunt-and-eat-default-rtdb.asia-southeast1.firebasedatabase.app)
   and paste it between the quotes below. Leave FIREBASE_CONFIG = null.
================================================================== */
const FIREBASE_RTDB_URL = "https://hunt-and-eat-default-rtdb.asia-southeast1.firebasedatabase.app"; // e.g. "https://hunt-and-eat-default-rtdb.asia-southeast1.firebasedatabase.app"

let __db = null;
if (FIREBASE_CONFIG) {
  firebase.initializeApp(FIREBASE_CONFIG);
  __db = firebase.firestore();
}
/* storage shim — if a native storage API already exists (e.g. Claude preview),
   keep it; otherwise use Firebase or this browser's local storage */
function __rtdbUrl(key) {
  return FIREBASE_RTDB_URL.replace(/\/+$/, "") + "/huntandeat/" + encodeURIComponent(key) + ".json";
}
window.storage = (window.storage && window.storage.get) ? window.storage :
FIREBASE_RTDB_URL ? {
  async get(key, shared) {
    const r = await fetch(__rtdbUrl(key));
    if (!r.ok) throw new Error("db read failed: " + r.status);
    const v = await r.json();
    return v == null ? null : { key, value: v, shared: true };
  },
  async set(key, value, shared) {
    const r = await fetch(__rtdbUrl(key), { method: "PUT", body: JSON.stringify(value) });
    if (!r.ok) throw new Error("db write failed: " + r.status);
    return { key, value, shared: true };
  },
  async delete(key) {
    await fetch(__rtdbUrl(key), { method: "DELETE" });
    return { key, deleted: true };
  },
  async list() { return { keys: [] }; },
} : {
  async get(key, shared) {
    if (__db) {
      const d = await __db.collection("huntandeat").doc(key).get();
      return d.exists ? { key, value: d.data().v, shared: true } : null;
    }
    const v = localStorage.getItem("he-" + key);
    return v == null ? null : { key, value: v, shared: false };
  },
  async set(key, value, shared) {
    if (__db) { await __db.collection("huntandeat").doc(key).set({ v: value }); }
    else { localStorage.setItem("he-" + key, value); }
    return { key, value, shared: !!shared };
  },
  async delete(key) {
    if (__db) { await __db.collection("huntandeat").doc(key).delete(); }
    else { localStorage.removeItem("he-" + key); }
    return { key, deleted: true };
  },
  async list() { return { keys: [] }; },
};
</script>

@keyframes he-spin{to{transform:rotate(360deg)}}
@keyframes he-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
.he-bar{width:190px;height:4px;border-radius:99px;background:rgba(166,33,46,.12);margin:18px auto 10px;overflow:hidden}

@keyframes he-slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
#he-loader{transition:opacity .45s ease}
.he-fade{animation:he-fadein .5s ease both}
@keyframes he-fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.he-ring,.he-ring:after,.he-bar span,.he-logowrap img,.he-fade{animation:none}}

function nextDays(n) {

  for (let i = 0; i < n; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    out.push({
      key: d.toISOString().slice(0, 10),
      label: i === 0 ? "Today" : i === 1 ? "Tomorrow" : d.toLocaleDateString("en-IN", { weekday: "short" }),
      sub: d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }),

/* ---------------- storage (SHARED: one store, all visitors see the same

async function loadKey(key, fallback) {
  try {
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : fallback;
  } catch {
    return fallback;
  }
}
async function saveKey(key, val) {

    await window.storage.set(key, JSON.stringify(val), true);
  } catch (e) {
    console.error("save failed", key, e);
  }
}

const TRACK_NS = "huntandeat";
function visitorId() {
  try {
    let v = localStorage.getItem("v-id");
    if (!v) { v = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); localStorage.setItem("v-id", v); }
    return v;
  } catch { return "anon"; }
}
function trackBase() {
  try { return (typeof FIREBASE_RTDB_URL !== "undefined" && FIREBASE_RTDB_URL) ? FIREBASE_RTDB_URL.replace(/\/+$/, "") : null; } catch { return null; }
}
function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
// saves an out-of-area lead you can call back when you expand
function joinWaitlist(d) {
  try {
    const base = trackBase(); if (!base) return;
    fetch(base + "/" + TRACK_NS + "/waitlist/" + todayKey() + ".json", {
      method: "POST",
      body: JSON.stringify({ t: Date.now(), phone: d.phone, name: d.name || "", pincode: d.pincode || "",
        la: d.loc ? d.loc.lat : null, ln: d.loc ? d.loc.lng : null, area: (d.area || "").slice(0, 120) }),
    }).catch(function () {});
  } catch {}
}

/* ============================ SESSION TRACKER ============================
   Records what people DO — clicks, scrolls, rage-clicks, which form field
   they gave up on — and replays it as a timeline in Admin -> Sessions.
   It never records what anyone types. Field names only, never values.
   Events are batched and capped so the free database tier is never strained.
========================================================================== */
const SES = {
  id: null, start: 0, events: [], sent: 0, dirty: false, last: 0,
  CAP: 220,              // hard cap on events per session
  clicks: [], lastClick: null,
};

function sesKey() {
  try {
    let k = sessionStorage.getItem("he-ses");
    if (!k) {
      k = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      sessionStorage.setItem("he-ses", k);
    }
    return k;
  } catch (e) { return "s" + Date.now().toString(36); }
}

// a short, human-readable label for whatever was clicked
function labelOf(el) {
  if (!el || !el.closest) return "page";
  const n = el.closest("button, a, input, select, textarea, label, [role=button]") || el;
  let s = (n.getAttribute && (n.getAttribute("aria-label") || n.getAttribute("placeholder"))) || n.innerText || n.value || n.tagName || "";
  s = String(s).replace(/\s+/g, " ").trim().slice(0, 42);
  if (!s) s = (n.tagName || "el").toLowerCase();
  const tag = (n.tagName || "").toLowerCase();
  const kind = tag === "button" || n.getAttribute("role") === "button" ? "button"
    : tag === "a" ? "link" : (tag === "input" || tag === "textarea" || tag === "select") ? "field" : "area";
  return kind + ":" + s;
}

function sesPush(type, a, b) {
  if (!SES.id || SES.events.length >= SES.CAP) return;
  SES.events.push([Math.round((Date.now() - SES.start) / 100), type, a === undefined ? null : a, b === undefined ? null : b]);
  SES.dirty = true;
}

async function sesFlush(final) {
  try {
    const base = trackBase();
    if (!base || !SES.id || !SES.dirty) return;
    SES.dirty = false;
    const body = JSON.stringify({
      t: SES.start,
      d: Math.round((Date.now() - SES.start) / 1000),      // seconds on site
      w: window.innerWidth, h: window.innerHeight,
      m: window.innerWidth < 640 ? "mobile" : "desktop",
      r: (document.referrer || "direct").slice(0, 80),
      v: (function () { try { return localStorage.getItem("v-id") || ""; } catch (e) { return ""; } })(),
      e: SES.events,
      c: SES.clicks.slice(0, 120),                          // click map points
      f: final ? 1 : 0,
    });
    const url = base + "/" + TRACK_NS + "/sessions/" + todayKey() + "/" + SES.id + ".json";
    if (final && navigator.sendBeacon) {
      navigator.sendBeacon(url + "?x-http-method-override=PUT", new Blob([body], { type: "text/plain" }));
      // sendBeacon can't send PUT directly on all browsers; fall back quietly
      fetch(url, { method: "PUT", body: body, keepalive: true }).catch(function () {});
    } else {
      await fetch(url, { method: "PUT", body: body }).catch(function () {});
    }
  } catch (e) {}
}

function startSession() {
  try {
    if (!trackBase()) return;                 // nothing to send to
    SES.id = sesKey();
    SES.start = Date.now();
    sesPush("open", (location.pathname + location.search).slice(0, 60));

    // ---- clicks, rage clicks, dead clicks ----
    document.addEventListener("click", function (ev) {
      const x = Math.round((ev.clientX / Math.max(1, window.innerWidth)) * 1000) / 10;
      const y = Math.round(((ev.pageY) / Math.max(1, document.body.scrollHeight)) * 1000) / 10;
      SES.clicks.push([x, y]);
      const lab = labelOf(ev.target);
      sesPush("click", lab, x + "," + y);

      const now = Date.now();
      if (SES.lastClick && now - SES.lastClick.t < 800 && Math.abs(x - SES.lastClick.x) < 4 && Math.abs(y - SES.lastClick.y) < 4) {
        SES.lastClick.n++;
        if (SES.lastClick.n === 3) sesPush("rage", lab);     // tapping the same spot repeatedly
      } else {
        SES.lastClick = { t: now, x: x, y: y, n: 1 };
      }
      // a click on nothing interactive = confusion about what is tappable
      if (!ev.target.closest || !ev.target.closest("button, a, input, select, textarea, label, [role=button]")) {
        sesPush("dead", lab);
      }
    }, true);

    // ---- scroll depth milestones ----
    let deepest = 0;
    window.addEventListener("scroll", function () {
      const h = document.body.scrollHeight - window.innerHeight;
      if (h <= 0) return;
      const pct = Math.min(100, Math.round((window.scrollY / h) * 100));
      [25, 50, 75, 100].forEach(function (mark) {
        if (pct >= mark && deepest < mark) { deepest = mark; sesPush("scroll", mark); }
      });
    }, { passive: true });

    // ---- form fields: which one they touched, which one they left ----
    document.addEventListener("focusin", function (ev) {
      const el = ev.target;
      if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      const name = (el.getAttribute("placeholder") || el.getAttribute("aria-label") || el.type || "field").slice(0, 32);
      sesPush("field", name);                 // the NAME of the field only — never the value
    }, true);
    document.addEventListener("focusout", function (ev) {
      const el = ev.target;
      if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      const name = (el.getAttribute("placeholder") || el.getAttribute("aria-label") || el.type || "field").slice(0, 32);
      sesPush("leave", name, el.value ? 1 : 0);   // filled (1) or left empty (0)
    }, true);

    // ---- send regularly and on the way out ----
    setInterval(function () { sesFlush(false); }, 12000);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") sesFlush(true);
    });
    window.addEventListener("pagehide", function () { sesFlush(true); });
  } catch (e) {}
}

// records a pinned location (no name/phone) so you can see where demand is
function trackPin(loc, zc, pincode, blocked) {
  try {
    const base = trackBase(); if (!base || !loc) return;
    fetch(base + "/" + TRACK_NS + "/pins/" + todayKey() + ".json", {
      method: "POST",
      body: JSON.stringify({
        t: Date.now(), v: visitorId(), la: loc.lat, ln: loc.lng,
        in: zc && zc.inside ? 1 : 0, d: zc && zc.dist != null ? Number(zc.dist.toFixed(2)) : null,
        z: (zc && zc.zone && zc.zone.name) || "", pc: pincode || "", b: blocked ? 1 : 0,
      }),
    }).catch(function () {});
  } catch {}
}

// records the furthest point each visitor reaches — once per step, per session
function trackStep(step) {
  try { sesPush("step", step); } catch (e) {}
  try {
    const base = trackBase(); if (!base) return;
    const done = JSON.parse(sessionStorage.getItem("v-steps") || "{}");
    if (done[step]) return;
    done[step] = 1;
    sessionStorage.setItem("v-steps", JSON.stringify(done));
    fetch(base + "/" + TRACK_NS + "/events/" + todayKey() + ".json", {
      method: "POST", body: JSON.stringify({ t: Date.now(), v: visitorId(), s: step }),
    }).catch(function () {});
  } catch {}
}
async function trackVisit(ns) {
  try {
    const base = (typeof FIREBASE_RTDB_URL !== "undefined" && FIREBASE_RTDB_URL) ? FIREBASE_RTDB_URL.replace(/\/+$/, "") : null;
    if (!base) return;
    if (sessionStorage.getItem("v-tracked")) return;   // one visit per browsing session
    sessionStorage.setItem("v-tracked", "1");
    let vid = localStorage.getItem("v-id");
    const isNew = !vid;
    if (!vid) { vid = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); localStorage.setItem("v-id", vid); }
    const d = new Date();
    const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    fetch(base + "/" + ns + "/visits/" + key + ".json", {
      method: "POST",
      body: JSON.stringify({ t: Date.now(), v: vid, n: isNew ? 1 : 0, r: (document.referrer || "direct").slice(0, 90) }),
    }).catch(function () {});
  } catch {}
}

/* ---------------------------------------------------------------------
   Boot screen. Picks up exactly where the static loader in index.html
   left off — same spinning ring, same breathing logo, same progress
   bar — so the logo keeps buffering without a visible jump.
--------------------------------------------------------------------- */
const BOOT_MSGS = ["Firing up the farm…", "Picking the freshest birds…", "Sharpening the knives…", "Almost ready…"];

/* ---------------------------------------------------------------------
   Auto-rotating banner strip across the top of the shop.
   Pauses while the pointer is on it, honours reduced-motion, and can be
   swiped on a phone. Banners come from the admin panel.
--------------------------------------------------------------------- */
function Banners({ banners, onCat, onProduct, products, categories }) {
  const list = (banners || []).filter((b) => b && (b.img || b.title || b.kicker));
  const n = list.length;
  const [i, setI] = useState(0);
  const [hold, setHold] = useState(false);
  const touch = useRef(null);

  useEffect(() => { if (i >= n) setI(0); }, [n, i]);

  useEffect(() => {
    if (n < 2 || hold) return;
    try {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    } catch (e) {}
    const t = setInterval(() => setI((x) => (x + 1) % n), 4800);
    return () => clearInterval(t);
  }, [n, hold, i]);

  if (!n) return null;

  const go = (d) => setI((x) => (x + d + n) % n);

  const toMenu = () => {
    const m = document.getElementById("menu");
    if (m) m.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  const open = (b) => {
    const L = b.link || "";

    // a specific item: show its category, scroll down, then open the item
    if (L.indexOf("prod:") === 0) {
      const p = (products || []).find((x) => x.id === L.slice(5));
      if (!p) { if (onCat) onCat("all"); toMenu(); return; }   // item was deleted — show the menu
      if (onCat) onCat(p.cat);
      toMenu();
      if (onProduct) setTimeout(() => onProduct(p), 420);      // let the scroll settle first
      return;
    }

    if (L.indexOf("cat:") === 0) {
      const id = L.slice(4);
      const alive = (categories || []).some((c) => c.id === id);
      if (onCat) onCat(alive ? id : "all");                    // category was renamed away — show everything
      toMenu();
      return;
    }

    if (L.indexOf("#") === 0) {
      const m = document.getElementById(L.slice(1));
      if (m) m.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (L) window.open(L, "_blank", "noopener");
  };

  return (
    <div style={{ maxWidth: 1100, margin: "0 auto", padding: "16px 16px 0" }}>
      <div className="bnr-wrap"
        onMouseEnter={() => setHold(true)} onMouseLeave={() => setHold(false)}
        onTouchStart={(e) => { touch.current = e.touches[0].clientX; setHold(true); }}
        onTouchEnd={(e) => {
          const s = touch.current; touch.current = null; setHold(false);
          if (s == null) return;
          const dx = e.changedTouches[0].clientX - s;
          if (Math.abs(dx) > 42) go(dx < 0 ? 1 : -1);
        }}>
        <div className="bnr-track" style={{ width: n * 100 + "%", transform: "translateX(-" + (i * (100 / n)) + "%)" }}>
          {list.map((b) => {
            const th = BTHEME[b.theme] || BTHEME.red;
            const clickable = !!b.link;
            return (
              <div key={b.id} className="bnr-slide" style={{ width: (100 / n) + "%", flex: "0 0 auto", position: "relative", cursor: clickable ? "pointer" : "default" }}
                onClick={() => clickable && open(b)}>
                {b.img || b.imgM ? (
                  <picture>
                    {b.imgM && <source media="(max-width: 760px)" srcSet={b.imgM} />}
                    <img src={b.img || b.imgM} alt={b.title || "offer"}
                      style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                  </picture>
                ) : (
                  <div className="bnr-pad" style={{ width: "100%", height: "100%", background: th.bg, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 18, padding: "22px 70px", boxSizing: "border-box", position: "relative", overflow: "hidden" }}>
                    <div className="bnr-emoji" style={{ position: "absolute", right: -14, bottom: -26, fontSize: 190, opacity: .11, lineHeight: 1, pointerEvents: "none" }}>{b.emoji || ""}</div>
                    <div style={{ position: "relative", zIndex: 2, maxWidth: 560 }}>
                      {b.kicker && <div className="bnr-k" style={{ color: th.gold, fontWeight: 800, marginBottom: 7 }}>{b.kicker}</div>}
                      {b.title && <div className="display bnr-h" style={{ color: th.ink, fontWeight: 800, letterSpacing: "-.01em" }}>{b.title}</div>}
                      {b.sub && <div className="bnr-s" style={{ color: th.sub, marginTop: 8, lineHeight: 1.5 }}>{b.sub}</div>}
                      {b.cta && (
                        <span className="bnr-cta" style={{ display: "inline-block", marginTop: 13, background: th.gold, color: "#3A2F22", borderRadius: 999, padding: "8px 19px", fontWeight: 800, fontSize: 12.5 }}>
                          {b.cta} →
                        </span>
                      )}
                    </div>
                    {b.price && (
                      <div className="bnr-badge" style={{ position: "relative", zIndex: 2, background: th.badge, color: th.badgeInk, borderRadius: 16, padding: "16px 24px", textAlign: "center", boxShadow: "0 8px 22px rgba(0,0,0,.18)", flex: "0 0 auto" }}>
                        {b.tag && <div style={{ fontSize: 10, letterSpacing: 2, fontWeight: 800, opacity: .78 }}>{b.tag}</div>}
                        <div style={{ display: "flex", alignItems: "baseline", gap: 8, justifyContent: "center", marginTop: 3 }}>
                          {b.was && <span style={{ fontSize: 17, opacity: .5, textDecoration: "line-through" }}>₹{b.was}</span>}
                          <span className="display bnr-price" style={{ fontWeight: 800, lineHeight: 1 }}>₹{b.price}</span>
                        </div>
                        {b.unit && <div style={{ fontSize: 11, opacity: .72, marginTop: 3, fontWeight: 600 }}>{b.unit}</div>}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {n > 1 && (
          <>
            <button className="bnr-arrow" style={{ left: 12 }} aria-label="Previous offer"
              onClick={(e) => { e.stopPropagation(); go(-1); }}>‹</button>
            <button className="bnr-arrow" style={{ right: 12 }} aria-label="Next offer"
              onClick={(e) => { e.stopPropagation(); go(1); }}>›</button>
            <div className="bnr-dots">
              {list.map((b, k) => (
                <button key={b.id} className={"bnr-dot" + (k === i ? " on" : "")} aria-label={"Offer " + (k + 1)}
                  onClick={(e) => { e.stopPropagation(); setI(k); }} />
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [products, setProducts] = useState(DEFAULT_PRODUCTS);
  const [categories, setCategories] = useState(CATEGORIES.slice(1));
  const [zones, setZones] = useState([]);
  const [slots, setSlots] = useState(DEFAULT_SLOTS);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [orders, setOrders] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => { trackVisit(TRACK_NS); trackStep("visit"); startSession(); }, []);

  useEffect(() => {
    (async () => {
      let coreOk = true, data = null;
      try {
        const r = await window.storage.get("huntandeat-core-v2", true);
        data = r ? JSON.parse(r.value) : null;
      } catch { coreOk = false; } // read failed — use defaults locally, never overwrite the database
      if (data) {
        setProducts(data.products || DEFAULT_PRODUCTS);
        setCategories(data.categories && data.categories.length ? data.categories : CATEGORIES.slice(1));
        setZones(data.zones || []);
        setSlots(data.slots || DEFAULT_SLOTS);
        setSettings({ ...DEFAULT_SETTINGS, ...(data.settings || {}) });
      } else if (coreOk) {
        // database confirmed empty — true first run: publish defaults once
        saveKey("huntandeat-core-v2", { products: DEFAULT_PRODUCTS, slots: DEFAULT_SLOTS, settings: DEFAULT_SETTINGS, categories: CATEGORIES.slice(1) });
      }
      const ord = await loadKey("huntandeat-orders", []);
      setOrders(ord);
      setLoaded(true);
    })();
  }, []);

  // customer app only ever APPENDS orders — it never edits catalog/settings
  const [custPhone, setCustPhone] = useState(() => { try { return localStorage.getItem("he-cust") || ""; } catch { return ""; } });

  // returning customer: quietly keep their live order status up to date
  useEffect(() => {
    if (!loaded || !custPhone) return;
    const t = setInterval(async () => {
      try { const r = await window.storage.get("huntandeat-orders", true); if (r) setOrders(JSON.parse(r.value)); } catch {}
    }, 30000);
    return () => clearInterval(t);
  }, [loaded, custPhone]);

  const placeOrder = async (o) => {
    const latest = await loadKey("huntandeat-orders", []);
    const next = [o, ...latest];
    setOrders(next);
    setCustPhone((o.phone || "").replace(/\D/g, "").slice(-10));
    await saveKey("huntandeat-orders", next);
  };

  if (!loaded) return <Booting />;

  return (
    <div style={{ minHeight: "100vh", background: BRAND.cream, fontFamily: "'Inter','Segoe UI',system-ui,sans-serif", color: BRAND.ink }}>
      <style>{`
                .display { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; font-optical-sizing: auto; letter-spacing: -0.01em; }
        .script { font-family: 'Dancing Script', 'Segoe Script', cursive; }
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { height: 6px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #d8d2c4; border-radius: 4px; }

      <Shop products={products} categories={categories} zones={zones} slots={slots} settings={settings} orders={orders} custPhone={custPhone} onPlaceOrder={placeOrder} />

}

/* ================================ SHOP ================================ */
function Shop({ products, categories, zones, slots, settings, orders, custPhone, onPlaceOrder }) {
  // Categories flagged "delivers all over India" can be ordered from anywhere.
  const freeCats = (categories || []).filter((c) => c.zoneFree).map((c) => c.id);
  const isFreeCat = (id) => freeCats.indexOf(id) >= 0;
  const liveZones = (zones || []).filter(zoneValid);

  // Remember the area the customer checked, so the catalogue matches where they are.
  const savedArea = (() => {
    try {
      const a = JSON.parse(localStorage.getItem("he-area") || "null");
      return a && a.lat ? a : null;
    } catch (e) { return null; }
  })();
  const [areaLoc, setAreaLoc] = useState(savedArea);
  const [areaOpen, setAreaOpen] = useState(false);
  const areaCheck = areaLoc && liveZones.length ? checkZones(areaLoc, zones) : null;
  const outsideZone = !!(areaCheck && !areaCheck.inside);
  const setArea = (ll) => {
    try { localStorage.setItem("he-area", JSON.stringify(ll)); } catch (e) {}
    setAreaLoc(ll); setAreaOpen(false);
  };
  const myOrders = custPhone
    ? (orders || []).filter((o) => (o.phone || "").replace(/\D/g, "").endsWith(custPhone.slice(-10)))
        .sort((a, b) => (a.placedAt < b.placedAt ? 1 : -1))
    : [];
  const liveOrder = myOrders.find((o) => o.status !== "Delivered" && o.status !== "Cancelled");
  const profile = (() => { try { return JSON.parse(localStorage.getItem("he-profile") || "null"); } catch (e) { return null; } })();
  const cats = [CATEGORIES[0], ...(categories && categories.length ? categories : CATEGORIES.slice(1))];
  const [cat, setCat] = useState("all");
  const [search, setSearch] = useState("");
  const [cart, setCart] = useState({}); // id -> qty
  const [cartOpen, setCartOpen] = useState(false);
  const [checkout, setCheckout] = useState(false);
  const [placed, setPlaced] = useState(null);
  const [trackOpen, setTrackOpen] = useState(false);
  const [detail, setDetail] = useState(null);

  const visible = products.filter((p) =>
    (cat === "all" || p.cat === cat) &&
    p.name.toLowerCase().includes(search.toLowerCase()) &&
    (!outsideZone || isFreeCat(p.cat))   // outside our zone: only India-wide items
  );

  const cartItems = Object.entries(cart)
    .map(([id, qty]) => ({ p: products.find((x) => x.id === id), qty }))
    .filter((x) => x.p && x.qty > 0);
  const subtotal = cartItems.reduce((s, x) => s + x.p.price * x.qty, 0);
  const savings = cartItems.reduce((s, x) => s + (x.p.mrp - x.p.price) * x.qty, 0);
  const delFee = subtotal >= settings.freeAbove || subtotal === 0 ? 0 : settings.deliveryFee;
  const total = subtotal + delFee;
  const count = cartItems.reduce((s, x) => s + x.qty, 0);

  const blockedItems = cartItems.filter((x) => outsideZone && !isFreeCat(x.p.cat));
  const dropBlocked = () => setCart((c) => {
    const n = { ...c };
    blockedItems.forEach((x) => { delete n[x.p.id]; });
    return n;
  });

  const add = (id, d) => { if (d > 0) trackStep("add_to_cart"); return setCart((c) => {
    const q = Math.max(0, (c[id] || 0) + d);
    const n = { ...c, [id]: q };
    if (q === 0) delete n[id];
    return n;
  }); };

  return (
    <div>
      {/* announcement strip — slim, letter-spaced, no phone */}
      <div style={{ background: "#5E0F18", color: "#E9C89B", fontSize: 10.5, padding: "7px 16px", textAlign: "center", letterSpacing: 2.4, fontWeight: 700 }}>
        FARM-TO-HOME&nbsp;&nbsp;·&nbsp;&nbsp;LIVE CUT AFTER YOU ORDER&nbsp;&nbsp;·&nbsp;&nbsp;SAME-DAY DELIVERY
      </div>

      {/* header */}
      <header style={{ background: "linear-gradient(180deg, #A6212E 0%, #8A1722 100%)", color: "#fff", padding: "16px", position: "sticky", top: 0, zIndex: 30, boxShadow: "0 4px 18px rgba(94,15,24,.35)" }}>
        <div className="hdr" style={{ maxWidth: 1100, margin: "0 auto", display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ width: 54, height: 54, borderRadius: 16, background: "#FBF3E4", display: "grid", placeItems: "center", boxShadow: "0 0 0 2px rgba(233,200,155,.55), 0 4px 12px rgba(0,0,0,.25)" }}>
              <Logo size={44} />
            </div>
            <div>
              <div className="display brandname" style={{ fontWeight: 800, fontSize: 24, lineHeight: 1.05, letterSpacing: 0.3, textShadow: "0 1px 2px rgba(0,0,0,.2)" }}>Hunt & Eat</div>
              <div style={{ fontSize: 9, color: "#E9C89B", letterSpacing: 3.2, fontWeight: 700, marginTop: 3 }}>THE FRESH AND ORIGINAL</div>
            </div>
          </div>
          <div style={{ flex: 1, minWidth: 220 }}>
            <input value={search} onChange={(e) => setSearch(e.target.value)}

            <button className="hdr-btn" onClick={() => setTrackOpen(true)} style={{ background: "transparent", border: "1.5px solid rgba(233,200,155,.55)", color: "#F3DCC0", borderRadius: 999, padding: "10px 18px", cursor: "pointer", fontSize: 13, fontWeight: 700, letterSpacing: 0.3 }}>My orders{myOrders.length ? " · " + myOrders.length : ""}</button>
            <button className="hdr-btn" onClick={() => { trackStep("view_cart"); setCartOpen(true); }} style={{ background: "linear-gradient(180deg, #F2CE8F, #E2AE5C)", border: "none", color: "#5E0F18", borderRadius: 999, padding: "10px 20px", cursor: "pointer", fontWeight: 800, fontSize: 14, boxShadow: "0 3px 10px rgba(0,0,0,.28)" }}>

      {/* hero — styled after the Hunt & Eat poster */}
      {liveOrder && (
        <div onClick={() => setTrackOpen(true)} className="fadeup"

          <span style={{ fontSize: 17 }}>{["📋", "🔪", "📦", "🛵", "🏠"][STATUSES.indexOf(liveOrder.status)] || "📋"}</span>
          <b>Your order {liveOrder.id} — {liveOrder.status}</b>
          <span style={{ opacity: .9 }}>· {liveOrder.slotLabel}</span>
          <span style={{ background: "rgba(255,255,255,.2)", borderRadius: 999, padding: "3px 12px", fontWeight: 800, fontSize: 12 }}>Track ›</span>
        </div>
      )}

      <Banners banners={settings.banners && settings.banners.length ? settings.banners : DEFAULT_BANNERS}
        onCat={setCat} onProduct={setDetail} products={products} categories={categories} />

      <section className="hero-sec" style={{ background: "radial-gradient(1200px 400px at 18% -10%, #FFFDF6, transparent), linear-gradient(180deg, #FDF8EE, #F6EADB)", borderBottom: "1px solid #E9D9B8", padding: "30px 16px 30px" }}>
        <div style={{ maxWidth: 1100, margin: "0 auto", display: "flex", gap: 24, alignItems: "center", flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 320px" }} className="fadeup">
            <div style={{ display: "inline-flex", alignItems: "center", gap: 8, background: "#FFFDF6", border: "1px solid #D9B96A", color: "#8E6A1F", fontWeight: 700, fontSize: 11, borderRadius: 999, padding: "6px 16px", marginBottom: 16, letterSpacing: 2 }}>
              ★ 100% FRESH · HYGIENIC · PREMIUM QUALITY
            </div>
            <h1 className="display hero-title" style={{ fontSize: 46, fontWeight: 800, margin: "0 0 10px", lineHeight: 1.08, letterSpacing: -0.5 }}>
              <span style={{ color: BRAND.green }}>Fresh Meat.</span><br />
              <span style={{ color: BRAND.ink }}>Real Taste.</span>
            </h1>
            <div style={{ width: 64, height: 3, background: "linear-gradient(90deg,#D9B96A,#B98A2E)", borderRadius: 2, margin: "0 0 12px" }} />
            <div style={{ fontSize: 12.5, fontWeight: 700, color: "#7a6a4f", letterSpacing: 2.4, margin: "0 0 8px" }}>
              CHICKEN <span style={{ color: "#C9A24B" }}>◆</span> COUNTRY EGGS <span style={{ color: "#C9A24B" }}>◆</span> QUAIL
            </div>
          </div>
        </div>
      </section>

      {/* categories — round photo tiles */}
      <section style={{ maxWidth: 1100, margin: "0 auto", padding: "26px 16px 4px" }}>
        <h2 className="display cat-head" style={{ fontSize: 25, fontWeight: 800, margin: "0 0 3px", letterSpacing: "-.01em" }}>
          Explore by Category
        </h2>
        <div style={{ fontSize: 13, color: "#7a6a4f", marginBottom: 18 }}>
          Farm-fresh naattu kozhi, country eggs and quail
        </div>
        <div className="catgrid">
          {cats.map((c) => {
            const locked = outsideZone && c.id !== "all" && !isFreeCat(c.id);
            const on = cat === c.id;
            const note = locked ? "Local only" : (c.zoneFree ? "All India" : (c.ta || ""));
            return (
              <button type="button" key={c.id} disabled={locked}
                className={"cattile" + (on ? " on" : "") + (locked ? " off" : "")}
                title={locked ? "Available inside our delivery area only" : c.name}
                onClick={() => { if (!locked) { setCat(c.id); const m = document.getElementById("menu"); if (m && c.id !== "all") m.scrollIntoView({ behavior: "smooth", block: "start" }); } }}>
                <span className="catcirc">
                  {locked ? <span className="catemoji">🔒</span>

              )}
              {areaLoc && !outsideZone && (

              {outsideZone && (

              </div>
              {blockedItems.length > 0 && (
                <div style={{ background: "#FBE9E7", border: "1px solid #F0C0BA", borderRadius: 10, padding: "11px 13px", margin: "12px 0", fontSize: 13, lineHeight: 1.55 }}>

                    style={{ background: BRAND.red, color: "#fff", border: "none", borderRadius: 8, padding: "8px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer" }}>
                    Remove them and continue

              <button disabled={blockedItems.length > 0} onClick={() => { trackStep("checkout"); setCartOpen(false); setCheckout(true); }}
                style={{ width: "100%", marginTop: 16, background: BRAND.green, color: "#fff", border: "none", borderRadius: 12, padding: "14px", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>
                Choose delivery slot →

        </Drawer>
      )}
      {checkout && (
        <Checkout cartItems={cartItems} subtotal={subtotal} delFee={delFee} total={total}
          slots={slots} settings={settings} orders={orders} zones={zones} freeCats={freeCats} onAreaKnown={setArea}
          back={() => { setCheckout(false); setCartOpen(true); }}
          done={(order) => { onPlaceOrder(order); setCart({}); setCheckout(false); setPlaced(order); }} />
      )}
      {placed && <Success order={placed} settings={settings} close={() => setPlaced(null)} />}
      {trackOpen && <Track orders={orders} settings={settings} close={() => setTrackOpen(false)} />}

  );
}

const DEFAULT_PIN = { lat: 12.8438, lng: 80.0576 }; // Guduvanchery

function ensureLeaflet() {
  return new Promise((resolve, reject) => {
    if (window.L) return resolve(window.L);
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload = () => resolve(window.L);
    s.onerror = () => reject(new Error("map load failed"));
    document.head.appendChild(s);
  });
}

function distKm(a, b) {
  const R = 6371, toRad = (x) => (x * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const s = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.pow(Math.sin(dLng / 2), 2);
  return 2 * R * Math.asin(Math.sqrt(s));
}
function isPoly(z) { return z.shape === "poly" && Array.isArray(z.points) && z.points.length >= 3; }
function zoneValid(z) { return z.active !== false && (isPoly(z) || (z.lat && z.lng && z.radiusKm > 0)); }
// ray casting: is the point inside the drawn boundary?
function inPolygon(loc, pts) {
  let hit = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i].lng, yi = pts[i].lat, xj = pts[j].lng, yj = pts[j].lat;
    if ((yi > loc.lat) !== (yj > loc.lat) && loc.lng < ((xj - xi) * (loc.lat - yi)) / (yj - yi) + xi) hit = !hit;
  }
  return hit;
}
function polyDist(loc, pts) { // rough distance to nearest boundary point (km)
  return Math.min.apply(null, pts.map((p) => distKm(loc, p)));
}
function checkZones(loc, zones) {
  const act = (zones || []).filter(zoneValid);
  if (!act.length || !loc) return null;
  let best = null;
  act.forEach((z) => {
    let inside, gap, dist;
    if (isPoly(z)) {
      inside = inPolygon(loc, z.points);
      dist = polyDist(loc, z.points);
      gap = inside ? -0.01 : dist;
    } else {
      dist = distKm(loc, z);
      gap = dist - z.radiusKm;
      inside = gap <= 0;
    }
    if (!best || gap < best.gap) best = { zone: z, dist, gap, inside };
  });
  return { inside: best.inside, zone: best.zone, dist: best.dist, gap: best.gap };
}

async function reverseGeocode(lat, lng) {
  // 1st try: OpenStreetMap Nominatim
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=" + lat + "&lon=" + lng, { headers: { Accept: "application/json" } });
    if (r.ok) {
      const d = await r.json(), a = d.address || {};
      const pin = (a.postcode || "").replace(/\D/g, "").slice(0, 6);
      const area = a.suburb || a.neighbourhood || a.village || a.town || a.city_district || a.city || "";
      const road = a.road || "";
      if (pin || area) return { pincode: pin, area, road, label: [road, area].filter(Boolean).join(", ") };
    }
  } catch (e) {}
  // 2nd try: BigDataCloud (free, no key) — covers gaps in OSM postcode data
  try {
    const r2 = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en&latitude=" + lat + "&longitude=" + lng);
    if (r2.ok) {
      const d2 = await r2.json();
      const pin = (d2.postcode || "").replace(/\D/g, "").slice(0, 6);
      const area = d2.locality || d2.city || d2.localityInfo && d2.localityInfo.administrative && d2.localityInfo.administrative.length
        ? (d2.locality || d2.city || "") : "";
      if (pin || area) return { pincode: pin, area, road: "", label: area };
    }
  } catch (e) {}
  return null;
}

function nearestZone(loc, zones) {
  const act = (zones || []).filter(zoneValid);
  if (!act.length || !loc) return null;
  let best = null;
  act.forEach((z) => {
    const d = isPoly(z) ? polyDist(loc, z.points) : Math.max(0, distKm(loc, z) - z.radiusKm);
    if (!best || d < best.d) best = { z, d };
  });
  return best.z;
}

function MapPicker({ initial, zones, onSave, close }) {
  const boxRef = useRef(null);
  const mapRef = useRef(null);
  const markRef = useRef(null);
  const zoneLayerRef = useRef(null);
  const drawnRef = useRef(null);
  const [pos, setPos] = useState(initial || null);
  const [note, setNote] = useState("Loading map…");
  const [failed, setFailed] = useState(false);
  const [mapReady, setMapReady] = useState(false);
  const [addr, setAddr] = useState(null);
  const [geoBusy, setGeoBusy] = useState(false);

  useEffect(() => {
    let alive = true;
    ensureLeaflet().then((L) => {
      if (!alive || !boxRef.current || mapRef.current) return;
      const act = (zones || []).filter(zoneValid);
      const firstC = act.length ? (isPoly(act[0]) ? act[0].points[0] : { lat: act[0].lat, lng: act[0].lng }) : null;
      const start = initial || firstC || DEFAULT_PIN;
      const map = L.map(boxRef.current).setView([start.lat, start.lng], initial ? 17 : 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
      zoneLayerRef.current = { L, map };
      const icon = L.divIcon({ html: "📍", className: "he-pin", iconSize: [32, 32], iconAnchor: [16, 30] });
      const marker = L.marker([start.lat, start.lng], { draggable: true, icon }).addTo(map);
      const upd = (ll) => setPos({ lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6) });
      marker.on("dragend", () => upd(marker.getLatLng()));
      map.on("click", (e) => { marker.setLatLng(e.latlng); upd(e.latlng); });
      mapRef.current = map; markRef.current = marker;
      setNote(""); if (!initial) setPos({ lat: start.lat, lng: start.lng });
      setMapReady(true);
      setTimeout(() => map.invalidateSize(), 250);
    }).catch(() => { setFailed(true); setNote(""); });
    return () => { alive = false; if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, []);

  // draw ONLY the delivery zone nearest to the customer — keeps their map clean
  useEffect(() => {
    const ctx = zoneLayerRef.current;
    if (!ctx) return;
    const { L, map } = ctx;
    const ref = pos || initial || DEFAULT_PIN;
    const z = nearestZone(ref, zones);
    if (!z) return;
    if (drawnRef.current && drawnRef.current.id === z.id) return; // already showing it
    if (drawnRef.current) map.removeLayer(drawnRef.current.layer);
    const style = { color: "#177245", weight: 2.5, fillColor: "#2E8B57", fillOpacity: 0.12 };
    const layer = isPoly(z)
      ? L.polygon(z.points.map((p) => [p.lat, p.lng]), style)
      : L.circle([z.lat, z.lng], { ...style, radius: z.radiusKm * 1000 });
    layer.addTo(map).bindTooltip(z.name || "Our delivery area");
    drawnRef.current = { id: z.id, layer };
    if (!initial && !pos) map.fitBounds(layer.getBounds(), { padding: [24, 24], maxZoom: 15 });
  }, [pos, zones, mapReady]);

  // look up the area + pincode for wherever the pin lands (debounced)
  useEffect(() => {
    if (!pos) return;
    let alive = true;
    setGeoBusy(true);
    const t = setTimeout(async () => {
      try { const a = await reverseGeocode(pos.lat, pos.lng); if (alive) setAddr(a); }
      catch { if (alive) setAddr(null); }
      finally { if (alive) setGeoBusy(false); }
    }, 900);
    return () => { alive = false; clearTimeout(t); };
  }, [pos]);

  const confirmPin = async () => {
    if (!pos) return;
    let a = addr;
    if (!a || !a.pincode) {           // lookup not done (or no pincode yet) — try once more now
      setGeoBusy(true);
      try { a = await reverseGeocode(pos.lat, pos.lng); } catch (e) {}
      setGeoBusy(false);
    }
    onSave({ lat: pos.lat, lng: pos.lng, pincode: a && a.pincode, area: a && a.label });
  };

  const locateMe = () => {
    if (!navigator.geolocation) return setNote("GPS not supported on this device.");
    setNote("Finding your location…");
    navigator.geolocation.getCurrentPosition(
      (p) => {
        const ll = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6) };
        setPos(ll); setNote("");
        if (mapRef.current && markRef.current) { mapRef.current.setView([ll.lat, ll.lng], 17); markRef.current.setLatLng([ll.lat, ll.lng]); }
      },
      () => setNote("Couldn't get GPS — allow location access, or drag the pin yourself."),
      { enableHighAccuracy: true, timeout: 9000 }
    );
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(14,10,8,.6)", zIndex: 70, display: "grid", placeItems: "center", padding: 12 }} onClick={close}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 16, width: "min(460px,100%)", padding: 16, boxSizing: "border-box" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
          <b className="display" style={{ fontSize: 18 }}>Pin your delivery location</b>
          <button onClick={close} style={{ background: "#f0ece1", border: "none", borderRadius: 999, width: 30, height: 30, cursor: "pointer", fontWeight: 700 }}>✕</button>
        </div>
        <div style={{ fontSize: 12.5, color: "#6b675e", marginBottom: 8 }}>Drag the 📍 pin or tap the map to place it exactly at your gate or building entrance.</div>
        {!failed && <div ref={boxRef} style={{ height: 300, width: "100%", borderRadius: 12, overflow: "hidden", border: "1px solid #E5DFD0", background: "#EFEAE0" }} />}
        {failed && <div style={{ background: "#FFF6E5", border: "1px solid #EAD9A8", borderRadius: 10, padding: 12, fontSize: 13 }}>Map couldn't load (weak connection). You can still share your GPS location using the button below.</div>}
        {note && <div style={{ fontSize: 12.5, color: BRAND.green, fontWeight: 700, marginTop: 8 }}>{note}</div>}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
          <button onClick={locateMe} type="button" style={{ background: "#fff", border: "1.5px solid " + BRAND.green, color: BRAND.green, borderRadius: 10, padding: "11px 8px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>🎯 Use my GPS</button>
          <button onClick={confirmPin} type="button" disabled={!pos || geoBusy}
            style={{ background: pos ? BRAND.green : "#ccc", color: "#fff", border: "none", borderRadius: 10, padding: "11px 8px", fontWeight: 800, fontSize: 13, cursor: pos ? "pointer" : "not-allowed" }}>{geoBusy ? "Detecting area…" : "✓ Confirm location"}</button>
        </div>
        {(() => {
          const zc = checkZones(pos, zones);
          if (!zc) return null;
          return zc.inside ? (
            <div style={{ background: "#EAF6EE", color: "#177245", borderRadius: 8, padding: "8px 10px", fontSize: 12.5, fontWeight: 800, marginTop: 8, textAlign: "center" }}>
              ✓ Great — we deliver here ({zc.zone.name || "service area"})
            </div>
          ) : (
            <div style={{ background: "#FBE9E7", color: "#8E1B25", borderRadius: 8, padding: "8px 10px", fontSize: 12.5, fontWeight: 700, marginTop: 8, textAlign: "center" }}>
              🚧 We don't deliver here just yet — <b>we'll start servicing your area shortly!</b> If you're inside the green area, move the pin there.
            </div>
          );
        })()}
        {pos && (geoBusy || addr) && (
          <div style={{ background: "#FBF7EF", border: "1px solid #EDE3D0", borderRadius: 8, padding: "8px 10px", fontSize: 12.5, marginTop: 8, textAlign: "center" }}>
            {geoBusy ? "Detecting your area…" : (
              <>
                <b>📍 {addr.label || "Location detected"}</b>
                {addr.pincode ? <span style={{ color: "#177245", fontWeight: 800 }}> · {addr.pincode}</span> : ""}
                <div style={{ fontSize: 11, color: "#8a857a" }}>Pincode will be filled in automatically</div>
              </>
            )}
          </div>
        )}
        {pos && <div style={{ fontSize: 11, color: "#8a857a", textAlign: "center", marginTop: 6 }}>Pin: {pos.lat}, {pos.lng}</div>}
        <div style={{ fontSize: 10.5, color: "#a39e93", textAlign: "center", marginTop: 4 }}>We note pinned areas (no personal details) to plan new delivery zones.</div>
      </div>
    </div>
  );
}

/* ---------------- checkout ---------------- */
function Checkout({ cartItems, subtotal, delFee, total, slots, settings, orders, zones, freeCats, onAreaKnown, back, done }) {
  const activeZones = (zones || []).filter(zoneValid);
  const freeIds = freeCats || [];
  const allShippable = cartItems.length > 0 && cartItems.every((x) => freeIds.indexOf(x.p.cat) >= 0);
  const allowedDays = settings.deliveryDays && settings.deliveryDays.length ? settings.deliveryDays : [0];
  const days = [];
  for (let i = 0; i < (settings.daysAhead || 14) && days.length < 8; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    if (!allowedDays.includes(d.getDay())) continue;
    days.push({ key: dkey(d), label: i === 0 ? "Today" : d.toLocaleDateString("en-IN", { weekday: "short" }), sub: d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }) });
  }
  const [day, setDay] = useState(days[0] ? days[0].key : "");
  const [slotId, setSlotId] = useState(null);
  const savedProfile = (() => { try { return JSON.parse(localStorage.getItem("he-profile") || "null"); } catch (e) { return null; } })();
  const [form, setForm] = useState(savedProfile
    ? { name: savedProfile.name || "", phone: savedProfile.phone || "", address: savedProfile.address || "",
        pincode: savedProfile.pincode || "", pay: savedProfile.pay || "cod", loc: savedProfile.loc || undefined }
    : { name: "", phone: "", address: "", pincode: "", pay: "cod" });
  const [remembered, setRemembered] = useState(!!(savedProfile && savedProfile.name));
  const [err, setErr] = useState("");
  const [locBusy, setLocBusy] = useState(false);
  const [mapOpen, setMapOpen] = useState(false);
  const [waitDone, setWaitDone] = useState(false);
  const [autoPin, setAutoPin] = useState(false);

  const captureLoc = () => {
    if (!navigator.geolocation) return setErr("GPS not supported on this device — you can continue without it.");
    setLocBusy(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => { setForm((f) => ({ ...f, loc: { lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6) } })); setLocBusy(false); setErr(""); },
      () => { setLocBusy(false); setErr("Couldn't get GPS — allow location access in your browser, or continue without it."); },
      { enableHighAccuracy: true, timeout: 9000 }
    );
  };

  // outside our local zone with an all-India basket -> courier, no slot needed
  const outside = activeZones.length > 0 && form.loc ? !checkZones(form.loc, zones).inside : false;
  const shipOnly = outside && allShippable;

  const now = new Date();
  const slotState = (s) => {
    if (!s.active) return { ok: false, why: "Unavailable" };
    if (day === dkey(now) && now.getHours() + now.getMinutes() / 60 >= s.start - (settings.cutoffHours || 0)) return { ok: false, why: "Cut-off passed" };
    const booked = orders.filter((o) => o.slotDate === day && o.slotId === s.id && o.status !== "Cancelled").length;
    if (booked >= s.capacity) return { ok: false, why: "Slot full" };
    return { ok: true, left: s.capacity - booked };
  };

  const place = () => {
    const ph = form.phone.replace(/\D/g, "").slice(-10);
    if (!form.name.trim()) return setErr("Please enter your full name.");
    if (!/^[6-9]\d{9}$/.test(ph)) return setErr("Please enter a valid 10-digit mobile number — it's required so our rider can reach you.");
    if (!form.address.trim()) return setErr("Please enter your full delivery address.");
    if (!/^\d{6}$/.test(form.pincode.trim())) return setErr("Please enter a valid 6-digit pincode.");
    if (activeZones.length) {
      if (!form.loc) return setErr("Please set your delivery location on the map — we serve only inside our delivery area.");
      const zc = checkZones(form.loc, zones);
      if (onAreaKnown) onAreaKnown(form.loc);
      if (!zc.inside) {
        trackPin(form.loc, zc, form.pincode, 1);
        if (!allShippable) {
          const bad = cartItems.filter((x) => freeIds.indexOf(x.p.cat) < 0).map((x) => x.p.name).join(", ");
          return setErr("Your location is outside our fresh-delivery area, so we can't send: " + bad + ". Remove those items and the rest of your order will be couriered to you anywhere in India.");
        }
      }
    } else {
      const serviceable = settings.pincodes.split(",").map((x) => x.trim());
      if (!serviceable.includes(form.pincode.trim()))
        return setErr(`Sorry, we don't deliver to ${form.pincode} yet. We serve: ${settings.pincodes}`);
    }
    if (!shipOnly && !slotId) return setErr("Please pick a delivery slot.");
    const slot = shipOnly ? null : slots.find((s) => s.id === slotId);
    const id = "HE" + Date.now().toString().slice(-6);
    done({
      id, items: cartItems.map(({ p, qty }) => ({ name: p.name, qty, price: p.price })),
      subtotal, delFee, total, ...form,
      slotDate: shipOnly ? dkey(new Date()) : day,
      slotId: shipOnly ? "ship" : slotId,
      slotLabel: shipOnly ? ("📦 All-India courier · " + (settings.shipDays || "3 – 5 days")) : slot.label,
      mode: shipOnly ? "ship" : "local",
      status: "Order received", placedAt: new Date().toISOString(),
    });
    trackStep("order_placed");
    try {
      localStorage.setItem("he-cust", ph);
      localStorage.setItem("he-profile", JSON.stringify({
        name: form.name.trim(), phone: ph, address: form.address.trim(),
        pincode: form.pincode.trim(), pay: form.pay, loc: form.loc || null,
      }));
    } catch (e) {}
  };

  return (
    <Drawer title="Checkout" close={back} backLabel="← Basket">
      {shipOnly ? (
        <>
          <SectionLabel n="1" t="All-India delivery" />
          <div style={{ background: "#FFF9EC", border: "1.5px solid #E8D5A8", borderRadius: 12, padding: 14, marginBottom: 18, fontSize: 13, lineHeight: 1.65, color: "#5c584e" }}>
            <b style={{ color: BRAND.ink }}>📦 We courier this order to you</b><br />
            Your location is outside our fresh-delivery area, but everything in your basket travels well.
            We pack and dispatch within 24 hours — delivery usually takes {settings.shipDays || "3 – 5 days"}, and we send tracking by SMS.
          </div>
        </>
      ) : (
      <>
      <SectionLabel n="1" t="Delivery slot" />
      <div style={{ fontSize: 12, color: "#7a6a4f", margin: "-4px 0 8px", fontWeight: 600 }}>
        We deliver on: {allowedDays.slice().sort().map((i) => ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][i]).join(", ")}
      </div>
      {days.length === 0 && <div style={{ color: BRAND.red, fontSize: 13, marginBottom: 10, fontWeight: 600 }}>No delivery dates are open right now — please WhatsApp us to arrange your order.</div>}
      <div style={{ display: "flex", gap: 8, marginBottom: 10, overflowX: "auto", paddingBottom: 4 }}>
        {days.map((d) => (
          <button key={d.key} onClick={() => { setDay(d.key); setSlotId(null); }}
            style={{ flex: "0 0 auto", minWidth: 86, border: "2px solid " + (day === d.key ? BRAND.green : "#e5dfd0"), background: day === d.key ? BRAND.green : "#fff", color: day === d.key ? "#fff" : BRAND.ink, borderRadius: 10, padding: "8px 4px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>
            {d.label}<div style={{ fontSize: 11, fontWeight: 500, opacity: 0.8 }}>{d.sub}</div>
          </button>
        ))}
      </div>
      <div style={{ display: "grid", gap: 8, marginBottom: 18 }}>
        {slots.map((s) => {
          const st = slotState(s);
          const sel = slotId === s.id;
          return (
            <button key={s.id} disabled={!st.ok} onClick={() => { trackStep("slot_picked"); setSlotId(s.id); }}
              style={{ display: "flex", justifyContent: "space-between", alignItems: "center", border: "2px solid " + (sel ? BRAND.green : "#e5dfd0"), background: sel ? "#FCEFEA" : st.ok ? "#fff" : "#f3f0e8", borderRadius: 10, padding: "10px 14px", cursor: st.ok ? "pointer" : "not-allowed", fontSize: 14, fontWeight: 600, color: st.ok ? BRAND.ink : "#a39e93" }}>
              <span>🕐 {s.label}</span>
              <span style={{ fontSize: 12, fontWeight: 600 }}>{st.ok ? (st.left <= 5 ? `${st.left} left` : "Available") : st.why}</span>
            </button>
          );
        })}
      </div>

      </>
      )}

      <SectionLabel n="2" t="Delivery details" />
      {remembered ? (
        <div style={{ background: "#EAF6EE", border: "1px solid #BEDFC8", borderRadius: 10, padding: "10px 12px", margin: "-2px 0 12px", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span style={{ fontSize: 12.5, fontWeight: 700, color: "#177245" }}>
            👋 Welcome back, {(form.name || "").split(" ")[0]}! Your saved details are filled in.
          </span>
          <button type="button" onClick={() => {
              try { localStorage.removeItem("he-profile"); } catch (e) {}
              setForm({ name: "", phone: "", address: "", pincode: "", pay: "cod" });
              setRemembered(false); setAutoPin(false);
            }}
            style={{ marginLeft: "auto", background: "none", border: "none", color: BRAND.green, fontSize: 11.5, fontWeight: 800, cursor: "pointer", textDecoration: "underline" }}>
            Use different details
          </button>
        </div>
      ) : (
        <div style={{ fontSize: 11.5, color: "#8a857a", fontWeight: 600, margin: "-4px 0 10px" }}>
          Fields marked <span style={{ color: "#D33", fontWeight: 800 }}>*</span> are required — we'll remember them for next time
        </div>
      )}
      <div style={{ display: "grid", gap: 12, marginBottom: 18 }}>
        <label style={fieldLbl}>
          <span>Full name<Req /></span>
          <input placeholder="Your name" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} style={inp} />
        </label>

        <label style={fieldLbl}>
          <span>Mobile number<Req /></span>
          <div style={{ display: "flex", alignItems: "stretch", border: "1.5px solid #e5dfd0", borderRadius: 10, overflow: "hidden", background: "#fff" }}>
            <span style={{ background: "#F6EADB", padding: "0 13px", fontWeight: 800, fontSize: 14, color: BRAND.green, display: "flex", alignItems: "center", borderRight: "1.5px solid #e5dfd0" }}>+91</span>
            <input inputMode="numeric" type="tel" maxLength={10} placeholder="10-digit mobile number" value={form.phone}
              onChange={(e) => setForm({ ...form, phone: e.target.value.replace(/\D/g, "").slice(0, 10) })}
              style={{ ...inp, border: "none", borderRadius: 0, flex: 1, letterSpacing: 1 }} />
          </div>
          <span style={{ fontSize: 11.5, color: "#8a857a", fontWeight: 500 }}>Order updates and rider calls come to this number</span>
        </label>

        <label style={fieldLbl}>
          <span>Full address<Req /></span>
          <textarea placeholder="Flat / door no, block, apartment name, street, landmark" rows={2} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} style={{ ...inp, resize: "vertical" }} />
        </label>

        <label style={fieldLbl}>
          <span>Pincode<Req /></span>
          <input inputMode="numeric" maxLength={6} placeholder="6-digit pincode" value={form.pincode}
            onChange={(e) => { setAutoPin(false); setForm({ ...form, pincode: e.target.value.replace(/\D/g, "").slice(0, 6) }); }}
            style={{ ...inp, borderColor: autoPin ? "#177245" : "#e5dfd0", background: autoPin ? "#F5FBF7" : "#fff" }} />
          {autoPin
            ? <span style={{ fontSize: 11.5, color: "#177245", fontWeight: 700 }}>✓ Filled automatically from your map pin — edit if it's wrong</span>
            : form.loc && <span style={{ fontSize: 11.5, color: "#8a857a" }}>Couldn't detect your pincode automatically — please type it</span>}
        </label>

        <div style={{ display: "grid", gap: 5 }}>
          <span style={{ fontSize: 13, fontWeight: 700 }}>Map location <span style={{ fontWeight: 500, color: "#8a857a", fontSize: 11.5 }}>(recommended — helps our rider reach you fast)</span></span>
          {form.loc ? (
            <div style={{ border: "2px solid #177245", background: "#EAF6EE", borderRadius: 10, padding: "10px 12px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <span style={{ fontWeight: 800, color: "#177245", fontSize: 13 }}>📍 Location pinned ✓</span>
              <span style={{ fontSize: 11, color: "#5c584e" }}>{form.loc.lat}, {form.loc.lng}</span>
              <button type="button" onClick={() => setMapOpen(true)} style={{ marginLeft: "auto", background: "#177245", color: "#fff", border: "none", borderRadius: 8, padding: "7px 14px", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>View / Edit pin</button>
            </div>
          ) : (
            <button type="button" onClick={() => setMapOpen(true)}
              style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, border: "2px dashed " + BRAND.green, background: "#FDF7F1", color: BRAND.green, borderRadius: 10, padding: "12px 14px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
              🗺️ Set your location on map
            </button>
          )}
          {activeZones.length > 0 && (() => {
            const zc = checkZones(form.loc, zones);
            if (!form.loc) return (
              <div style={{ background: "#FFF6E5", border: "1px solid #EAD9A8", borderRadius: 8, padding: "9px 12px", fontSize: 12.5, fontWeight: 700, color: "#8E6A1F" }}>
                📍 Please set your location on the map — we deliver only inside our service area.
              </div>
            );
            return zc.inside ? (
              <div style={{ background: "#EAF6EE", border: "1px solid #BEDFC8", borderRadius: 8, padding: "9px 12px", fontSize: 12.5, fontWeight: 800, color: "#177245" }}>
                ✓ We deliver to your location — {zc.zone.name || "service area"} ({zc.dist.toFixed(1)} km from us)
              </div>
            ) : (
              <div style={{ background: "#FBE9E7", border: "1px solid #F0C0BA", borderRadius: 8, padding: "9px 12px", fontSize: 12.5, fontWeight: 700, color: "#8E1B25" }}>
                🚧 <b>We'll start servicing your area shortly!</b> We're not delivering to this location yet — we're expanding across Chennai fast.
                {waitDone ? (
                  <div style={{ marginTop: 8, color: "#177245", fontWeight: 800 }}>✓ Thanks! We'll message you the moment we launch in your area.</div>
                ) : (
                  <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                    <button type="button" onClick={() => {
                        const ph = (form.phone || "").replace(/\D/g, "").slice(-10);
                        if (!/^[6-9]\d{9}$/.test(ph)) { setErr("Enter your mobile number above first, then tap Notify me."); return; }
                        joinWaitlist({ phone: ph, name: form.name, loc: form.loc, pincode: form.pincode, area: form.address });
                        setWaitDone(true);
                      }}
                      style={{ background: "#8E1B25", color: "#fff", border: "none", borderRadius: 8, padding: "8px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer" }}>
                      🔔 Notify me when you launch here
                    </button>
                    <a href={`https://wa.me/91${(settings.phone || "").replace(/\D/g, "").slice(-10)}?text=${encodeURIComponent("Hi Hunt & Eat! Please notify me when you start delivering to my area. My location: https://www.google.com/maps?q=" + form.loc.lat + "," + form.loc.lng)}`}
                      target="_blank" rel="noreferrer" style={{ background: "#1FA855", color: "#fff", borderRadius: 8, padding: "8px 14px", fontWeight: 800, fontSize: 12.5, textDecoration: "none" }}>WhatsApp us</a>
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      </div>

      <SectionLabel n="3" t="Payment" />
      <div style={{ display: "grid", gap: 8, marginBottom: 16 }}>
        {[["cod", "💵 Cash on delivery"], ["upi", "📱 UPI on delivery (GPay / PhonePe)"]].map(([v, l]) => (
          <label key={v} style={{ display: "flex", gap: 10, alignItems: "center", border: "2px solid " + (form.pay === v ? BRAND.green : "#e5dfd0"), borderRadius: 10, padding: "10px 14px", cursor: "pointer", fontSize: 14, fontWeight: 600, background: form.pay === v ? "#eef5f0" : "#fff" }}>
            <input type="radio" checked={form.pay === v} onChange={() => setForm({ ...form, pay: v })} />{l}
          </label>
        ))}
      </div>

      <div style={{ background: "#faf7f0", borderRadius: 10, padding: "10px 14px", fontSize: 14, marginBottom: 14 }}>
        <Row l="Item total" r={rup(subtotal)} />
        <Row l="Delivery" r={delFee === 0 ? "FREE" : rup(delFee)} green={delFee === 0} />
        <Row l={<b>To pay</b>} r={<b>{rup(total)}</b>} />
      </div>
      {err && <div style={{ color: BRAND.red, fontSize: 13, marginBottom: 10, fontWeight: 600 }}>{err}</div>}
      <button onClick={place} style={{ width: "100%", background: BRAND.green, color: "#fff", border: "none", borderRadius: 12, padding: 14, fontWeight: 800, fontSize: 15, cursor: "pointer" }}>
        Place order — {rup(total)}
      </button>
      {mapOpen && <MapPicker initial={form.loc} zones={zones} close={() => setMapOpen(false)}
        onSave={(ll) => {
          trackStep("location_set");
          trackPin({ lat: ll.lat, lng: ll.lng }, checkZones({ lat: ll.lat, lng: ll.lng }, zones), ll.pincode || form.pincode, 0);
          const auto = ll.pincode && /^\d{6}$/.test(ll.pincode);
          setForm((f) => ({
            ...f,
            loc: { lat: ll.lat, lng: ll.lng },
            pincode: auto ? ll.pincode : f.pincode,
            address: f.address.trim() ? f.address : (ll.area || f.address),
          }));
          setAutoPin(!!auto);
          setMapOpen(false); setErr("");
        }} />}
    </Drawer>
  );
}
const inp = { padding: "11px 14px", borderRadius: 10, border: "1.5px solid #e5dfd0", fontSize: 14, outline: "none", fontFamily: "inherit", boxSizing: "border-box", width: "100%" };
const SectionLabel = ({ n, t }) => (
  <div style={{ display: "flex", gap: 8, alignItems: "center", margin: "0 0 10px" }}>
    <span style={{ background: BRAND.green, color: "#fff", width: 22, height: 22, borderRadius: 999, display: "grid", placeItems: "center", fontSize: 12, fontWeight: 800 }}>{n}</span>
    <span className="display" style={{ fontWeight: 800, fontSize: 16 }}>{t}</span>
  </div>
);

function Success({ order, settings, close }) {
  const waNumber = (settings?.phone || "").replace(/\D/g, "").slice(-10);
  const waText = encodeURIComponent(
    `🐓 *Hunt & Eat — New Order ${order.id}*\n` +
    order.items.map((i) => `• ${i.name} ×${i.qty} — ${rup(i.price * i.qty)}`).join("\n") +
    `\nTotal: *${rup(order.total)}* (${order.pay === "cod" ? "COD" : "UPI on delivery"})` +
    `\nSlot: ${order.slotDate} · ${order.slotLabel}` +
    `\nName: ${order.name} · 📞 ${order.phone}` +
    `\nAddress: ${order.address}, ${order.pincode}` +
    (order.loc ? `\n📍 Map: https://www.google.com/maps?q=${order.loc.lat},${order.loc.lng}` : "")
  );
  return (
    <Modal close={close}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 56 }}>✅</div>
        <h3 className="display" style={{ fontWeight: 800, fontSize: 22, margin: "8px 0 4px" }}>Order placed!</h3>
        <div style={{ fontSize: 14, color: "#5c584e" }}>Order ID</div>
        <div className="display" style={{ fontSize: 26, fontWeight: 800, color: BRAND.green, letterSpacing: 1 }}>{order.id}</div>
        <div style={{ background: "#faf7f0", borderRadius: 10, padding: 12, margin: "14px 0", fontSize: 14, textAlign: "left" }}>
          <Row l="Slot" r={`${order.slotDate} · ${order.slotLabel}`} />
          <Row l="Payment" r={order.pay === "cod" ? "Cash on delivery" : "UPI on delivery"} />
          <Row l={<b>To pay</b>} r={<b>{rup(order.total)}</b>} />
        </div>
        <a href={`https://wa.me/91${waNumber}?text=${waText}`} target="_blank" rel="noreferrer"
          style={{ display: "block", background: "#1FA855", color: "#fff", borderRadius: 12, padding: 13, fontWeight: 700, fontSize: 15, textDecoration: "none", marginBottom: 10 }}>
          📲 Confirm on WhatsApp
        </a>
        <p style={{ fontSize: 12, color: "#8a857a", margin: "0 0 10px" }}>Tap above to send your order to our kitchen on WhatsApp — this confirms it fastest.</p>
        <button onClick={close} style={{ width: "100%", background: BRAND.green, color: "#fff", border: "none", borderRadius: 12, padding: 13, fontWeight: 700, fontSize: 15, cursor: "pointer" }}>Continue shopping</button>
      </div>
    </Modal>
  );
}

function Track({ orders, settings, close }) {
  const savedPhone = (() => { try { return localStorage.getItem("he-cust") || ""; } catch { return ""; } })();
  const [q, setQ] = useState(savedPhone);
  const [list, setList] = useState(null);
  const [open, setOpen] = useState(null);
  const [live, setLive] = useState(orders);
  const [busy, setBusy] = useState(false);
  const [manual, setManual] = useState(!savedPhone);

  const refresh = async (query) => {
    setBusy(true);
    let data = live;
    try { const r = await window.storage.get("huntandeat-orders", true); if (r) data = JSON.parse(r.value); setLive(data); } catch {}
    setBusy(false);
    const s = (query != null ? query : q).trim();
    if (!s) return setList([]);
    const digits = s.replace(/\D/g, "");
    const mine = data.filter((o) =>
      o.id.toLowerCase() === s.toLowerCase() ||
      (digits.length >= 10 && (o.phone || "").replace(/\D/g, "").endsWith(digits.slice(-10)))
    ).sort((a, b) => (a.placedAt < b.placedAt ? 1 : -1));
    if (digits.length >= 10) { try { localStorage.setItem("he-cust", digits.slice(-10)); } catch {} }
    setList(mine);
    if (mine.length === 1) setOpen(mine[0].id);
  };

  // auto-load past orders for a returning customer
  useEffect(() => { if (savedPhone) refresh(savedPhone); }, []);
  // keep live status fresh while the panel is open
  useEffect(() => {
    if (list === null) return;
    const t = setInterval(() => refresh(), 15000);
    return () => clearInterval(t);
  }, [list, q]);

  const done = (o) => o.status === "Delivered" || o.status === "Cancelled";

  return (
    <Drawer title="My orders" close={close}>
      {!manual ? (
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#FBF7EF", border: "1px solid #EDE3D0", borderRadius: 10, padding: "10px 12px", marginBottom: 10, flexWrap: "wrap" }}>
          <span style={{ fontSize: 12.5, fontWeight: 700 }}>Orders for +91 •••••{savedPhone.slice(-4)}</span>
          <button onClick={() => { try { localStorage.removeItem("he-cust"); } catch {} setManual(true); setQ(""); setList(null); }}
            style={{ marginLeft: "auto", background: "none", border: "none", color: BRAND.green, fontSize: 11.5, fontWeight: 800, cursor: "pointer", textDecoration: "underline" }}>
            Different number
          </button>
        </div>
      ) : (
        <>
          <p style={{ fontSize: 12.5, color: "#6b675e", margin: "0 0 10px" }}>
            Enter your mobile number to see all your orders, or an order ID (e.g. HE123456).
          </p>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <input value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && refresh()}
              placeholder="Mobile number or order ID" inputMode="tel" style={{ ...inp, flex: 1 }} />
            <button onClick={() => refresh()} style={{ background: BRAND.green, color: "#fff", border: "none", borderRadius: 10, padding: "0 20px", fontWeight: 800, cursor: "pointer" }}>
              {busy ? "…" : "Find"}
            </button>
          </div>
        </>
      )}
      {list === null && savedPhone && (
        <div style={{ textAlign: "center", color: "#8a857a", padding: "30px 0", fontSize: 13.5 }}>Loading your orders…</div>
      )}

      {list && list.length === 0 && (
        <div style={{ textAlign: "center", color: "#8a857a", padding: "30px 10px", fontSize: 13.5 }}>
          No orders found for that number.<br />Check the number you used while ordering.
        </div>
      )}

      {list && list.length > 0 && (
        <>
          <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1.5, color: "#8a857a", margin: "10px 0 8px" }}>
            {list.length} ORDER{list.length > 1 ? "S" : ""} FOUND
          </div>
          <div style={{ display: "grid", gap: 10 }}>
            {list.map((o) => {
              const idx = STATUSES.indexOf(o.status);
              const expanded = open === o.id;
              const cancelled = o.status === "Cancelled";
              return (
                <div key={o.id} style={{ border: "1px solid #EDE3D0", borderRadius: 12, overflow: "hidden", background: "#fff" }}>
                  <div onClick={() => setOpen(expanded ? null : o.id)} style={{ padding: "12px 14px", cursor: "pointer" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                      <div>
                        <div className="display" style={{ fontWeight: 800, fontSize: 15 }}>{o.id}</div>
                        <div style={{ fontSize: 11.5, color: "#8a857a" }}>
                          {new Date(o.placedAt).toLocaleDateString("en-IN", { day: "numeric", month: "short" })} · {o.slotLabel}
                        </div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontWeight: 800 }}>{rup(o.total)}</div>
                        <span style={{ fontSize: 11, fontWeight: 800, borderRadius: 999, padding: "2px 9px",
                          background: cancelled ? "#FBE9E7" : done(o) ? "#EAF6EE" : "#FFF6E5",
                          color: cancelled ? BRAND.red : done(o) ? "#177245" : "#8E6A1F" }}>
                          {o.status}
                        </span>
                      </div>
                    </div>
                    <div style={{ fontSize: 12.5, color: "#5c584e", marginTop: 6 }}>
                      {o.items.map((i) => `${i.qty}× ${i.name}`).join(" · ")}
                    </div>
                    <div style={{ fontSize: 11.5, color: BRAND.green, fontWeight: 700, marginTop: 6 }}>
                      {expanded ? "Hide details ▲" : "View tracking ▼"}
                    </div>
                  </div>

                  {expanded && (
                    <div style={{ borderTop: "1px solid #F2EADB", padding: "12px 14px", background: "#FDFBF6" }}>
                      {cancelled ? (
                        <div style={{ color: BRAND.red, fontWeight: 700, fontSize: 13.5 }}>This order was cancelled.</div>
                      ) : (
                        STATUSES.map((s, i) => {
                          const on = i <= idx, cur = i === idx;
                          return (
                            <div key={s} style={{ display: "flex", gap: 10, alignItems: "center", padding: "5px 0" }}>
                              <span style={{ width: 22, height: 22, borderRadius: 999, background: on ? BRAND.green : "#e5dfd0", color: "#fff", display: "grid", placeItems: "center", fontSize: 12 }}>{on ? "✓" : ""}</span>
                              <span style={{ fontWeight: cur ? 800 : on ? 600 : 500, color: on ? BRAND.ink : "#a39e93", fontSize: 13.5 }}>
                                {["📋", "🔪", "📦", "🛵", "🏠"][i]} {s}{cur ? " — now" : ""}
                              </span>
                            </div>
                          );
                        })
                      )}
                      <div style={{ borderTop: "1px dashed #E5DFD0", marginTop: 10, paddingTop: 10, fontSize: 12.5, color: "#5c584e" }}>
                        <div>📍 {o.address}, {o.pincode}</div>
                        <div>{o.pay === "cod" ? "💵 Cash on delivery" : "📱 UPI on delivery"} · {rup(o.total)}</div>
                        {o.rider && !done(o) && <div>🛵 Rider assigned: {o.rider}</div>}
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
                        <a href={`https://wa.me/91${(settings.phone || "").replace(/\D/g, "").slice(-10)}?text=${encodeURIComponent("Hi Hunt & Eat, about my order " + o.id + ": ")}`}
                          target="_blank" rel="noreferrer" style={{ background: "#1FA855", color: "#fff", borderRadius: 9, padding: "10px 0", textAlign: "center", fontWeight: 800, fontSize: 12.5, textDecoration: "none" }}>
                          💬 Ask about this
                        </a>
                        <a href={`tel:${(settings.phone || "").replace(/\s/g, "")}`}
                          style={{ background: BRAND.ink, color: "#fff", borderRadius: 9, padding: "10px 0", textAlign: "center", fontWeight: 800, fontSize: 12.5, textDecoration: "none" }}>
                          📞 Call us
                        </a>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <div style={{ fontSize: 11, color: "#a39e93", textAlign: "center", marginTop: 12 }}>Status updates automatically every 15 seconds</div>
        </>
      )}
    </Drawer>
  );
}

/* ---------------- shared UI ---------------- */
function Drawer({ title, close, backLabel, children }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(14,43,29,.5)", zIndex: 50, display: "flex", justifyContent: "flex-end" }} onClick={close}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", width: "min(440px,100%)", height: "100%", overflowY: "auto", padding: 20, boxSizing: "border-box" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 className="display" style={{ margin: 0, fontWeight: 800, fontSize: 20 }}>{title}</h3>
          <button onClick={close} style={{ background: "#f0ece1", border: "none", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>{backLabel || "✕ Close"}</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Modal({ close, children }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(14,43,29,.5)", zIndex: 60, display: "grid", placeItems: "center", padding: 16 }} onClick={close}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 16, width: "min(420px,100%)", maxHeight: "90vh", overflowY: "auto", padding: 20, boxSizing: "border-box", position: "relative" }}>
        <button onClick={close} style={{ position: "absolute", top: 10, right: 10, background: "#f0ece1", border: "none", borderRadius: 999, width: 30, height: 30, cursor: "pointer", fontWeight: 700 }}>✕</button>
        {children}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
