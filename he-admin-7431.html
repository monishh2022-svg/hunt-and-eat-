<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   STEP 1 (OPTIONAL BUT RECOMMENDED): PASTE YOUR FIREBASE CONFIG HERE
   ---------------------------------------------------------------------
   Get it free at https://console.firebase.google.com
   (Create project -> Firestore Database -> Project settings -> Web app)
   It looks like:  { apiKey: "...", authDomain: "...", projectId: "..." }
   With Firebase: customer orders sync to the admin panel automatically.
   Without it (null): DEMO MODE — data saves only on each visitor's own
   device, and customer orders reach you via the WhatsApp button instead.
===================================================================== */
const FIREBASE_CONFIG = null;

/* ============ PLAN B: REALTIME DATABASE (always free) ============
   If Firestore asks for billing, use Firebase "Realtime Database"
   instead. Create it (Build -> Realtime Database), copy its URL
   (looks like https://hunt-and-eat-default-rtdb.asia-southeast1.firebasedatabase.app)
   and paste it between the quotes below. Leave FIREBASE_CONFIG = null.
================================================================== */
const FIREBASE_RTDB_URL = "https://hunt-and-eat-default-rtdb.asia-southeast1.firebasedatabase.app"; // e.g. "https://hunt-and-eat-default-rtdb.asia-southeast1.firebasedatabase.app"


let __db = null;
if (FIREBASE_CONFIG) {
  firebase.initializeApp(FIREBASE_CONFIG);
  __db = firebase.firestore();
}
/* storage shim — if a native storage API already exists (e.g. Claude preview),
   keep it; otherwise use Firebase or this browser's local storage */
function __rtdbUrl(key) {
  return FIREBASE_RTDB_URL.replace(/\/+$/, "") + "/huntandeat/" + encodeURIComponent(key) + ".json";
}
window.storage = (window.storage && window.storage.get) ? window.storage :
FIREBASE_RTDB_URL ? {
  async get(key, shared) {
    const r = await fetch(__rtdbUrl(key));
    if (!r.ok) throw new Error("db read failed: " + r.status);
    const v = await r.json();
    return v == null ? null : { key, value: v, shared: true };
  },
  async set(key, value, shared) {
    const r = await fetch(__rtdbUrl(key), { method: "PUT", body: JSON.stringify(value) });
    if (!r.ok) throw new Error("db write failed: " + r.status);
    return { key, value, shared: true };
  },
  async delete(key) {
    await fetch(__rtdbUrl(key), { method: "DELETE" });
    return { key, deleted: true };
  },
  async list() { return { keys: [] }; },
} : {
  async get(key, shared) {
    if (__db) {
      const d = await __db.collection("huntandeat").doc(key).get();
      return d.exists ? { key, value: d.data().v, shared: true } : null;
    }
    const v = localStorage.getItem("he-" + key);
    return v == null ? null : { key, value: v, shared: false };
  },
  async set(key, value, shared) {
    if (__db) { await __db.collection("huntandeat").doc(key).set({ v: value }); }
    else { localStorage.setItem("he-" + key, value); }
    return { key, value, shared: !!shared };
  },
  async delete(key) {
    if (__db) { await __db.collection("huntandeat").doc(key).delete(); }
    else { localStorage.removeItem("he-" + key); }
    return { key, deleted: true };
  },
  async list() { return { keys: [] }; },
};
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;


/* ============ HUNT & EAT — ADMIN DASHBOARD (separate app) ============

===================================================================== */

const BRAND = {
  red: "#A6212E", redDark: "#7A1520", cream: "#FBF3E4", creamSoft: "#F6EADB",
  bg: "#F4F0E6", ink: "#241E1A", danger: "#8E1B25", ok: "#177245",

const DEFAULT_CATS = [
  { id: "chicken", name: "Country Chicken" }, { id: "cuts", name: "Cuts & Boneless" },

const STATUSES = ["Order received", "Cutting & cleaning", "Packed", "Out for delivery", "Delivered"];
const rup = (n) => "₹" + Number(n).toLocaleString("en-IN");

  siren: { label: "🚨 ALARM siren", sweep: [[440, 950, .45], [950, 440, .45], [440, 950, .45], [950, 440, .45]] },
  klaxon: { label: "⏰ Loud klaxon", notes: [[740, 0, .3], [560, .3, .3], [740, .62, .3], [560, .92, .3], [740, 1.24, .45]] },
};
function playTone(key, vol) {
  const ac = audioCtx(); if (!ac) return;
  const t = TONES[key] || TONES.bell;
  if (t.sweep) { // continuous rising/falling alarm
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sawtooth";
    let time = ac.currentTime;
    t.sweep.forEach(([f1, f2, d]) => { o.frequency.setValueAtTime(f1, time); o.frequency.linearRampToValueAtTime(f2, time + d); time += d; });
    const V = (vol == null ? 0.5 : vol) * 0.55;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(V, ac.currentTime + 0.05);
    g.gain.setValueAtTime(V, time - 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, time);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(time + 0.05);
    return;
  }
  t.notes.forEach(([f, st, dur]) => {
    [1, 2].forEach((mult, mi) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = mi ? "triangle" : "sine";
      o.frequency.value = f * mult;
      const t0 = ac.currentTime + st;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime((vol == null ? 0.35 : vol) * (mi ? 0.18 : 1), t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.06);
    });
  });
}

/* ---- shared storage: same keys the storefront uses ---- */
async function loadKey(key, fallback) {
  try { const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }
  catch { return fallback; }
}
async function saveKey(key, val) {
  try { await window.storage.set(key, JSON.stringify(val), true); return true; }
  catch (e) { console.error("save failed", key, e); return false; }
}

/* ---- photo upload: resize + compress to keep storage light ---- */
function compressImage(file, maxW = 640, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---- Bulk prep sheet: consolidated item counts only ---- */
function printBulkKOT(list, brand) {
  const agg = {};
  list.forEach((o) => o.items.forEach((i) => {
    const key = i.name + ((i.addons && i.addons.length) ? " (+" + i.addons.join(", ") + ")" : "");
    agg[key] = (agg[key] || 0) + i.qty;
  }));
  const names = Object.keys(agg).sort();
  const totalUnits = names.reduce((s, n) => s + agg[n], 0);
  const rows = names.map((n) => '<tr><td class="q">' + agg[n] + '</td><td class="n">' + n + "</td></tr>").join("");
  const slots = {};
  list.forEach((o) => { const k = (o.slotDate || "") + " " + (o.slotLabel || ""); slots[k] = (slots[k] || 0) + 1; });
  const slotLine = Object.keys(slots).map((k) => k + " (" + slots[k] + ")").join(" · ");
  const html = '<!DOCTYPE html><html><head><title>Prep sheet</title><style>' +
    "body{font-family:'Courier New',monospace;max-width:420px;margin:0 auto;padding:12px;color:#000}" +

    ".n{font-size:15px;font-weight:bold}.tot{font-size:14px;font-weight:bold}" +
    '</style></head><body>' +
    "<h2>" + brand + "</h2>" +
    '<div class="c s"><b>KITCHEN PREP SHEET</b></div>' +
    '<div class="c s">' + new Date().toLocaleString("en-IN") + "</div>" +
    '<div class="c s">' + list.length + " order(s)" + (slotLine ? " · " + slotLine : "") + "</div>" +
    "<hr/><table>" + rows + "</table><hr/>" +
    '<div class="tot">TOTAL ITEMS: ' + totalUnits + "</div>" +
    '<div class="s">Orders: ' + list.map((o) => o.id).join(", ") + "</div>" +

  const w = window.open("", "_blank", "width=420,height=680");
  if (!w) { alert("Popup blocked — allow popups to print the prep sheet."); return; }

function ensureLeaflet() {
  return new Promise((resolve, reject) => {
    if (window.L) return resolve(window.L);
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload = () => resolve(window.L);
    s.onerror = () => reject(new Error("map load failed"));
    document.head.appendChild(s);
  });
}

function isPoly(z) { return z.shape === "poly" && Array.isArray(z.points) && z.points.length >= 3; }

function ZoneEditor({ zones, onSave, close }) {
  const [list, setList] = useState((zones || []).map((z) => ({ ...z })));
  const [sel, setSel] = useState(0);
  const [drawing, setDrawing] = useState(false);
  const boxRef = useRef(null), mapRef = useRef(null), layersRef = useRef([]);
  const listRef = useRef(list), selRef = useRef(sel), drawRef = useRef(drawing);
  const [ready, setReady] = useState(false), [failed, setFailed] = useState(false);
  useEffect(() => { listRef.current = list; selRef.current = sel; drawRef.current = drawing; });

  useEffect(() => {
    let alive = true;
    ensureLeaflet().then((L) => {
      if (!alive || !boxRef.current || mapRef.current) return;
      const f0 = list[0];
      const c0 = f0 ? (isPoly(f0) ? f0.points[0] : (f0.lat ? { lat: f0.lat, lng: f0.lng } : null)) : null;
      const map = L.map(boxRef.current).setView(c0 ? [c0.lat, c0.lng] : [12.8438, 80.0576], c0 ? 14 : 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
      map.on("click", (e) => {
        const i = selRef.current, cur = listRef.current, z = cur[i];
        if (!z) return;
        const pt = { lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6) };
        if (z.shape === "poly") {
          if (!drawRef.current) return; // only add points while drawing is on
          setList(cur.map((x, j) => (j === i ? { ...x, points: [...(x.points || []), pt] } : x)));
        } else {
          setList(cur.map((x, j) => (j === i ? { ...x, ...pt } : x)));
        }
      });
      mapRef.current = map; setReady(true);
      setTimeout(() => map.invalidateSize(), 250);
    }).catch(() => setFailed(true));
    return () => { alive = false; if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, []);

  // redraw all zones
  useEffect(() => {
    if (!ready || !mapRef.current || !window.L) return;
    const L = window.L, map = mapRef.current;
    layersRef.current.forEach((l) => map.removeLayer(l));
    layersRef.current = [];
    list.forEach((z, i) => {
      const on = z.active !== false, cur = i === sel;
      const style = { color: cur ? "#A6212E" : on ? "#177245" : "#999", weight: cur ? 3 : 2,
        fillColor: cur ? "#A6212E" : "#2E8B57", fillOpacity: on ? (cur ? 0.15 : 0.07) : 0.03 };
      if (z.shape === "poly") {
        const pts = z.points || [];
        if (pts.length >= 2) {
          const layer = pts.length >= 3
            ? L.polygon(pts.map((p) => [p.lat, p.lng]), style)
            : L.polyline(pts.map((p) => [p.lat, p.lng]), style);
          layer.addTo(map).bindTooltip(z.name || "Zone");
          layersRef.current.push(layer);
        }
        if (cur) pts.forEach((p, pi) => {
          const mk = L.marker([p.lat, p.lng], { draggable: true,
            icon: L.divIcon({ html: '<div style="background:#A6212E;color:#fff;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;border:2px solid #fff">' + (pi + 1) + "</div>", className: "he-vertex", iconSize: [20, 20], iconAnchor: [10, 10] }) }).addTo(map);
          mk.on("dragend", () => {
            const ll = mk.getLatLng(), cl = listRef.current, ci = selRef.current;
            setList(cl.map((x, j) => (j === ci ? { ...x, points: x.points.map((q, qi) => (qi === pi ? { lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6) } : q)) } : x)));
          });
          layersRef.current.push(mk);
        });
      } else if (z.lat && z.lng && z.radiusKm) {
        const c = L.circle([z.lat, z.lng], { ...style, radius: z.radiusKm * 1000 }).addTo(map).bindTooltip((z.name || "Zone") + " · " + z.radiusKm + " km");
        const m = L.marker([z.lat, z.lng], { icon: L.divIcon({ html: cur ? "🎯" : "📍", className: "he-pin", iconSize: [26, 26], iconAnchor: [13, 26] }) }).addTo(map);
        layersRef.current.push(c, m);
      }
    });
  }, [list, sel, ready]);

  const upd = (i, patch) => setList(list.map((z, j) => (j === i ? { ...z, ...patch } : z)));
  const addCircle = () => {
    const c = mapRef.current ? mapRef.current.getCenter() : { lat: 12.8438, lng: 80.0576 };
    setList([...list, { id: "z" + Date.now(), name: "New circle zone", shape: "circle", lat: +c.lat.toFixed(6), lng: +c.lng.toFixed(6), radiusKm: 5, active: true }]);
    setSel(list.length); setDrawing(false);
  };
  const addPoly = () => {
    setList([...list, { id: "z" + Date.now(), name: "New drawn zone", shape: "poly", points: [], active: true }]);
    setSel(list.length); setDrawing(true);
  };
  const cur = list[sel];
  const isP = cur && cur.shape === "poly";

  return (
    <Modal close={close}>
      <h3 className="display" style={{ fontWeight: 800, margin: "0 0 4px" }}>Delivery zones (geofence)</h3>
      <p style={{ fontSize: 12.5, color: "#6b675e", margin: "0 0 8px" }}>
        Draw your area street by street, or use a simple radius circle. Orders are accepted only inside these shapes.
      </p>

      {isP && (
        <div style={{ background: drawing ? "#FDF0EE" : "#F6F2E8", border: "1.5px solid " + (drawing ? BRAND.red : "#E5DFD0"), borderRadius: 10, padding: "9px 12px", marginBottom: 8, fontSize: 12.5, fontWeight: 700 }}>
          {drawing
            ? "✏️ Drawing ON — tap each street corner on the map to trace your boundary. Tap 'Done drawing' when the shape is closed."
            : "Drag the numbered points to fine-tune. Turn drawing on to add more corners."}
          <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
            <button onClick={() => setDrawing(!drawing)} style={{ background: drawing ? BRAND.ok : BRAND.red, color: "#fff", border: "none", borderRadius: 8, padding: "7px 13px", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>
              {drawing ? "✓ Done drawing" : "✏️ Continue drawing"}
            </button>
            <button onClick={() => upd(sel, { points: (cur.points || []).slice(0, -1) })} style={{ background: "#f0ece1", border: "none", borderRadius: 8, padding: "7px 13px", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>↩ Undo point</button>
            <button onClick={() => upd(sel, { points: [] })} style={{ background: "#fbe9e7", color: BRAND.danger, border: "none", borderRadius: 8, padding: "7px 13px", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>Clear all</button>
            <span style={{ alignSelf: "center", fontSize: 11.5, color: (cur.points || []).length >= 3 ? BRAND.ok : BRAND.danger }}>
              {(cur.points || []).length} point(s){(cur.points || []).length < 3 ? " — need at least 3" : " ✓"}
            </span>
          </div>
        </div>
      )}

      {!failed && <div ref={boxRef} style={{ height: 300, borderRadius: 12, overflow: "hidden", border: "1px solid #E5DFD0", background: "#EFEAE0" }} />}
      {failed && <div style={{ background: "#FFF6E5", border: "1px solid #EAD9A8", borderRadius: 10, padding: 12, fontSize: 13 }}>Map couldn't load — check your connection.</div>}

      <div style={{ display: "grid", gap: 8, marginTop: 10 }}>
        {list.map((z, i) => (
          <div key={z.id || i} onClick={() => { setSel(i); if (z.shape !== "poly") setDrawing(false); }}
            style={{ background: i === sel ? "#FDF0EE" : "#FBF7EF", border: "2px solid " + (i === sel ? BRAND.red : "transparent"), borderRadius: 10, padding: 10, cursor: "pointer" }}>
            <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontSize: 14 }}>{z.shape === "poly" ? "✏️" : "⭕"}</span>
              <input value={z.name || ""} onChange={(e) => upd(i, { name: e.target.value })} placeholder="Zone name (e.g. Guduvanchery main road block)"
                style={{ ...inp, padding: "7px 10px", fontSize: 13, fontWeight: 700 }} />
              <button onClick={(e) => { e.stopPropagation(); if (window.confirm("Delete this zone?")) { setList(list.filter((_, j) => j !== i)); setSel(0); setDrawing(false); } }}
                style={{ background: "#fbe9e7", color: BRAND.danger, border: "none", borderRadius: 7, padding: "6px 10px", fontWeight: 800, cursor: "pointer" }}>✕</button>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              {z.shape === "poly" ? (
                <span style={{ fontSize: 12, fontWeight: 700, color: "#6b675e" }}>Drawn boundary · {(z.points || []).length} points</span>
              ) : (
                <label style={{ fontSize: 12, fontWeight: 700, display: "flex", gap: 5, alignItems: "center" }}>
                  Radius
                  <input type="number" min={0.5} step={0.5} value={z.radiusKm || 5} onChange={(e) => upd(i, { radiusKm: Number(e.target.value) || 1 })}
                    style={{ ...inp, width: 70, padding: "6px 8px", fontSize: 13 }} /> km
                </label>
              )}
              <label style={{ fontSize: 12, fontWeight: 700, display: "flex", gap: 5, alignItems: "center", color: z.active !== false ? BRAND.ok : BRAND.danger }}>
                <input type="checkbox" checked={z.active !== false} onChange={() => upd(i, { active: z.active === false })} />
                {z.active !== false ? "Active" : "Paused"}
              </label>
            </div>
          </div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
        <button onClick={addPoly} style={{ background: BRAND.red, color: "#fff", border: "none", borderRadius: 10, padding: 11, fontWeight: 800, fontSize: 13, cursor: "pointer" }}>✏️ Draw new zone</button>
        <button onClick={addCircle} style={{ background: "#fff", border: "1.5px dashed " + BRAND.red, color: BRAND.red, borderRadius: 10, padding: 11, fontWeight: 800, fontSize: 13, cursor: "pointer" }}>⭕ Add radius zone</button>
      </div>
      <button onClick={() => onSave(list.filter((z) => (z.shape === "poly" ? (z.points || []).length >= 3 : z.lat && z.lng && z.radiusKm > 0)))}
        style={{ width: "100%", marginTop: 8, background: BRAND.ok, color: "#fff", border: "none", borderRadius: 10, padding: 12, fontWeight: 800, cursor: "pointer" }}>
        Save & publish zones
      </button>
      <p style={{ fontSize: 11.5, color: "#8a857a", marginTop: 8, marginBottom: 0 }}>
        Drawn zones need 3+ points to save. No active zones = geofencing off (pincode list used instead).
      </p>
    </Modal>
  );
}

const FUNNEL = [
  ["visit", "Opened the website", "👀"],
  ["add_to_cart", "Added an item to basket", "🛒"],
  ["view_cart", "Opened the basket", "🧺"],
  ["checkout", "Started checkout", "📝"],
  ["slot_picked", "Chose a delivery slot", "🕐"],
  ["location_set", "Pinned their location", "📍"],
  ["order_placed", "Placed the order", "✅"],
];

function Visitors({ orders }) {
  const [data, setData] = useState(null);
  const [funnel, setFunnel] = useState(null);
  const [busy, setBusy] = useState(false);
  const dbUrl = (typeof FIREBASE_RTDB_URL !== "undefined" && FIREBASE_RTDB_URL) ? FIREBASE_RTDB_URL.replace(/\/+$/, "") : null;

  const load = async () => {
    if (!dbUrl) { setData("nodb"); return; }
    setBusy(true);
    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(dkey(d)); }
    const out = [];
    for (const d of days) {
      try {
        const r = await fetch(dbUrl + "/" + VISIT_NS + "/visits/" + d + ".json");
        const j = r.ok ? await r.json() : null;
        const rows = j ? Object.keys(j).map((k) => j[k]) : [];
        const seen = {}; rows.forEach((x) => { if (x && x.v) seen[x.v] = 1; });
        out.push({ date: d, visits: rows.length, uniq: Object.keys(seen).length, refs: rows.map((x) => (x && x.r) || "direct") });
      } catch { out.push({ date: d, visits: 0, uniq: 0, refs: [] }); }
    }
    // funnel: unique visitors who reached each step
    const steps = {};
    FUNNEL.forEach(([k]) => { steps[k] = {}; });
    for (const d of days) {
      try {
        const r = await fetch(dbUrl + "/" + VISIT_NS + "/events/" + d + ".json");
        const j = r.ok ? await r.json() : null;
        if (j) Object.keys(j).forEach((k) => { const e = j[k]; if (e && e.s && steps[e.s]) steps[e.s][e.v] = 1; });
      } catch {}
    }
    setFunnel(FUNNEL.map(([k, label, icon]) => ({ k, label, icon, n: Object.keys(steps[k]).length })));
    setData(out); setBusy(false);
  };
  useEffect(() => { load(); }, []);

  if (data === "nodb") return <div style={{ background: "#FFF6E5", border: "1px solid #EAD9A8", borderRadius: 10, padding: 14, fontSize: 13.5 }}>Visitor tracking needs the database connected (FIREBASE_RTDB_URL).</div>;
  if (!data) return <div style={{ color: "#8a857a", padding: 20 }}>Loading visitor data…</div>;

  const today = data[data.length - 1] || { visits: 0, uniq: 0 };
  const week = data.reduce((s, d) => s + d.visits, 0);
  const weekU = (() => { const all = {}; data.forEach((d) => d.refs.forEach(() => {})); return data.reduce((s, d) => s + d.uniq, 0); })();
  const ordersOn = (d) => orders.filter((o) => (o.placedAt || "").slice(0, 10) === d && o.status !== "Cancelled").length;
  const todayOrders = ordersOn(today.date);
  const conv = today.visits ? Math.round((todayOrders / today.visits) * 100) : 0;
  const max = Math.max.apply(null, data.map((d) => d.visits).concat([1]));

  const refCount = {};
  data.forEach((d) => d.refs.forEach((r) => {
    let host = "Direct / WhatsApp";
    try { if (r && r !== "direct") host = new URL(r).hostname.replace("www.", ""); } catch {}
    refCount[host] = (refCount[host] || 0) + 1;
  }));
  const refs = Object.keys(refCount).sort((a, b) => refCount[b] - refCount[a]).slice(0, 6);

  return (
    <>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 12, marginBottom: 18 }}>
        <Stat l="Visits today" v={today.visits} sub={today.uniq + " unique device(s)"} />
        <Stat l="Orders today" v={todayOrders} sub="from these visits" />
        <Stat l="Conversion today" v={conv + "%"} sub="visits that ordered" hot={today.visits > 10 && conv < 5} />
        <Stat l="Visits this week" v={week} sub="last 7 days" />
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h3 className="display" style={{ fontWeight: 800, fontSize: 17, margin: "0 0 10px" }}>Last 7 days</h3>
        <button onClick={load} style={{ background: "#fff", border: "1.5px solid " + BRAND.red, color: BRAND.red, borderRadius: 8, padding: "6px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>{busy ? "…" : "↻ Refresh"}</button>
      </div>
      <div style={{ background: "#fff", borderRadius: 12, padding: 16, display: "flex", alignItems: "flex-end", gap: 10, height: 170 }}>
        {data.map((d) => (
          <div key={d.date} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
            <div style={{ fontSize: 11, fontWeight: 800 }}>{d.visits}</div>
            <div title={d.uniq + " unique"} style={{ width: "100%", background: BRAND.red, borderRadius: "6px 6px 0 0", height: Math.max(4, Math.round((d.visits / max) * 100)) + "px", opacity: .85 }} />
            <div style={{ fontSize: 10.5, color: "#8a857a" }}>{new Date(d.date + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" })}</div>
            <div style={{ fontSize: 10, color: "#b3ada0" }}>{ordersOn(d.date)} ord</div>
          </div>
        ))}
      </div>

      <h3 className="display" style={{ fontWeight: 800, fontSize: 17, margin: "22px 0 4px" }}>Where visitors drop off</h3>
      <p style={{ fontSize: 12.5, color: "#6b675e", margin: "0 0 10px" }}>Last 7 days — how far each visitor got before leaving. The red line is your biggest leak.</p>
      {funnel && (() => {
        const top = funnel[0].n || 1;
        let worst = { i: -1, lost: 0 };
        funnel.forEach((s, i) => {
          if (i === 0) return;
          const lost = funnel[i - 1].n - s.n;
          if (lost > worst.lost) worst = { i, lost };
        });
        return (
          <div style={{ display: "grid", gap: 6 }}>
            {funnel.map((s, i) => {
              const pct = Math.round((s.n / top) * 100);
              const prev = i ? funnel[i - 1].n : null;
              const lost = prev == null ? 0 : prev - s.n;
              const lostPct = prev ? Math.round((lost / prev) * 100) : 0;
              const isWorst = i === worst.i && worst.lost > 0;
              return (
                <div key={s.k}>
                  {i > 0 && lost > 0 && (
                    <div style={{ fontSize: 11.5, fontWeight: 700, color: isWorst ? BRAND.danger : "#a39e93", padding: "2px 0 2px 6px" }}>
                      ↓ {lost} left here ({lostPct}%){isWorst ? "  ← biggest drop-off" : ""}
                    </div>
                  )}
                  <div style={{ background: "#fff", borderRadius: 10, padding: "10px 14px", border: isWorst ? "1.5px solid " + BRAND.danger : "1px solid #EDE7DA" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, marginBottom: 6 }}>
                      <span style={{ fontSize: 13.5, fontWeight: 700 }}>{s.icon} {s.label}</span>
                      <span style={{ fontSize: 13.5, fontWeight: 800 }}>{s.n} <span style={{ fontSize: 11.5, color: "#8a857a", fontWeight: 600 }}>({pct}%)</span></span>
                    </div>
                    <div style={{ background: "#F1ECE1", borderRadius: 999, height: 9, overflow: "hidden" }}>
                      <div style={{ width: Math.max(2, pct) + "%", height: "100%", background: s.k === "order_placed" ? BRAND.ok : BRAND.red, borderRadius: 999 }} />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })()}

      <h3 className="display" style={{ fontWeight: 800, fontSize: 17, margin: "20px 0 8px" }}>Where visitors came from</h3>
      <div style={{ display: "grid", gap: 6 }}>
        {refs.length === 0 && <div style={{ color: "#8a857a", fontSize: 13 }}>No visits recorded yet.</div>}
        {refs.map((r) => (
          <div key={r} style={{ background: "#fff", borderRadius: 10, padding: "9px 14px", display: "flex", justifyContent: "space-between", fontSize: 13.5 }}>
            <span style={{ fontWeight: 600 }}>{r}</span><b>{refCount[r]}</b>
          </div>
        ))}
      </div>
      <p style={{ fontSize: 11.5, color: "#8a857a", marginTop: 12 }}>
        Counts one visit per device per browsing session. Links shared on WhatsApp usually show as “Direct / WhatsApp”.
      </p>
    </>
  );
}

function downloadCSV(filename, rows) {
  const esc = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const csv = rows.map((r) => r.map(esc).join(",")).join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

const EV = {
  open:   { icon: "🚪", label: (a) => "Opened the site" },
  click:  { icon: "👆", label: (a) => "Tapped " + (a || "") },
  rage:   { icon: "😠", label: (a) => "Tapped the same spot again and again — " + (a || ""), bad: true },
  dead:   { icon: "❓", label: (a) => "Tapped something that doesn't do anything — " + (a || ""), warn: true },
  scroll: { icon: "📜", label: (a) => "Scrolled " + a + "% down" },
  field:  { icon: "✏️", label: (a) => "Started typing in " + (a || "a field") },
  leave:  { icon: "↪️", label: (a, b) => (b ? "Filled in " : "Left empty: ") + (a || "a field"), warn: (a, b) => !b },
  step:   { icon: "✅", label: (a) => "Reached: " + ({ visit: "opened the site", add_to_cart: "added to basket", view_cart: "opened the basket", checkout: "started checkout", slot_picked: "chose a slot", location_set: "pinned location", order_placed: "PLACED THE ORDER" }[a] || a), good: true },
};

function Sessions() {
  const base = (typeof FIREBASE_RTDB_URL !== "undefined" && FIREBASE_RTDB_URL) ? FIREBASE_RTDB_URL.replace(/\/+$/, "") : null;
  const [days, setDays] = useState(3);
  const [rows, setRows] = useState(null);
  const [open, setOpen] = useState(null);
  const [busy, setBusy] = useState(false);
  const [view, setView] = useState("list");   // list | heat

  const load = async () => {
    if (!base) { setRows("nodb"); return; }
    setBusy(true);
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = dkey(d);
      try {
        const r = await fetch(base + "/" + VISIT_NS + "/sessions/" + key + ".json");
        const j = r.ok ? await r.json() : null;
        if (j) Object.keys(j).forEach((id) => out.push({ id: id, day: key, ...j[id] }));
      } catch (e) {}
    }
    out.sort((a, b) => (b.t || 0) - (a.t || 0));
    setRows(out); setBusy(false);
  };
  useEffect(() => { load(); }, [days]);

  if (rows === "nodb") return <div style={{ background: "#FFF6E5", border: "1px solid #EAD9A8", borderRadius: 10, padding: 14, fontSize: 13.5 }}>Session tracking needs the database connected.</div>;
  if (!rows) return <div style={{ color: "#8a857a", padding: 20 }}>Loading sessions…</div>;

  const outcome = (s) => {
    const ev = s.e || [];
    if (ev.some((x) => x[1] === "step" && x[2] === "order_placed")) return { txt: "Ordered", col: BRAND.ok, bg: "#EAF6EE" };
    if (ev.some((x) => x[1] === "step" && x[2] === "checkout")) return { txt: "Left at checkout", col: BRAND.danger, bg: "#FBE9E7" };
    if (ev.some((x) => x[1] === "step" && x[2] === "add_to_cart")) return { txt: "Left with items in basket", col: "#8E6A1F", bg: "#FFF6E5" };
    return { txt: "Only browsed", col: "#6b675e", bg: "#F4F0E6" };
  };
  const rage = (s) => (s.e || []).filter((x) => x[1] === "rage").length;
  const dead = (s) => (s.e || []).filter((x) => x[1] === "dead").length;

  const ordered = rows.filter((s) => outcome(s).txt === "Ordered").length;
  const frustrated = rows.filter((s) => rage(s) > 0).length;
  const allClicks = [];
  rows.forEach((s) => (s.c || []).forEach((p) => allClicks.push(p)));

  return (
    <>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 12, marginBottom: 14 }}>
        <Stat l="Sessions" v={rows.length} sub={"last " + days + " day(s)"} />
        <Stat l="Ordered" v={ordered} sub={rows.length ? Math.round((ordered / rows.length) * 100) + "% of visits" : "—"} />
        <Stat l="Frustrated visits" v={frustrated} sub="rage taps detected" hot={frustrated > 0} />
        <Stat l="Clicks mapped" v={allClicks.length} sub="for the heatmap" />
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12, alignItems: "center" }}>
        {[["list", "📃 Sessions"], ["heat", "🔥 Click heatmap"]].map(([v, l]) => (
          <button key={v} onClick={() => setView(v)} style={{ background: view === v ? BRAND.red : "#fff", color: view === v ? "#fff" : BRAND.ink, border: "1px solid #e5dfd0", borderRadius: 999, padding: "7px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>{l}</button>
        ))}
        <select value={days} onChange={(e) => setDays(Number(e.target.value))} style={{ ...inp, width: "auto", padding: "6px 10px", fontSize: 12.5, fontWeight: 700 }}>
          <option value={1}>Today</option><option value={3}>Last 3 days</option><option value={7}>Last 7 days</option>
        </select>
        <button onClick={load} style={{ marginLeft: "auto", background: "#fff", border: "1.5px solid " + BRAND.red, color: BRAND.red, borderRadius: 8, padding: "6px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>{busy ? "…" : "↻ Refresh"}</button>
      </div>

      {view === "heat" ? (
        <>
          <p style={{ fontSize: 12.5, color: "#6b675e", margin: "0 0 10px" }}>
            Where people tapped, as a share of the page. Left to right is across the screen, top to bottom is down the page.
          </p>
          <div style={{ position: "relative", width: "100%", paddingTop: "130%", background: "linear-gradient(#fff,#FBF7EF)", border: "1px solid #E6DBC8", borderRadius: 12, overflow: "hidden" }}>
            {allClicks.map((p, i) => (
              <span key={i} style={{ position: "absolute", left: p[0] + "%", top: p[1] + "%", width: 26, height: 26, marginLeft: -13, marginTop: -13,
                borderRadius: "50%", background: "radial-gradient(circle, rgba(214,40,40,.55), rgba(214,40,40,0) 70%)", pointerEvents: "none" }} />
            ))}
            {allClicks.length === 0 && <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center", color: "#8a857a", fontSize: 13 }}>No clicks recorded yet.</div>}
            {[25, 50, 75].map((m) => (
              <div key={m} style={{ position: "absolute", left: 0, right: 0, top: m + "%", borderTop: "1px dashed #E6DBC8" }}>
                <span style={{ position: "absolute", left: 6, top: -16, fontSize: 10.5, color: "#a39e93" }}>{m}% down the page</span>
              </div>
            ))}
          </div>
        </>
      ) : rows.length === 0 ? (
        <div style={{ textAlign: "center", color: "#8a857a", padding: 30 }}>No sessions recorded yet. They appear a few seconds after someone visits the store.</div>
      ) : (
        <div style={{ display: "grid", gap: 9 }}>
          {rows.slice(0, 60).map((s) => {
            const o = outcome(s), isOpen = open === s.id, r = rage(s), d = dead(s);
            return (
              <div key={s.id} style={{ background: "#fff", borderRadius: 12, border: "1px solid " + (isOpen ? BRAND.red : "transparent"), overflow: "hidden" }}>
                <div onClick={() => setOpen(isOpen ? null : s.id)} style={{ padding: "12px 14px", cursor: "pointer" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                    <div>
                      <b style={{ fontSize: 14 }}>{s.m === "mobile" ? "📱 Mobile" : "💻 Desktop"}</b>
                      <span style={{ fontSize: 12, color: "#8a857a", marginLeft: 8 }}>
                        {new Date(s.t).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}
                        {" · "}{s.d ? (s.d > 59 ? Math.round(s.d / 60) + " min" : s.d + " sec") : "0 sec"} on site
                      </span>
                    </div>
                    <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                      {r > 0 && <span style={{ background: "#FBE9E7", color: BRAND.danger, borderRadius: 6, padding: "2px 8px", fontSize: 11, fontWeight: 800 }}>😠 {r} rage tap{r > 1 ? "s" : ""}</span>}
                      {d > 0 && <span style={{ background: "#FFF6E5", color: "#8E6A1F", borderRadius: 6, padding: "2px 8px", fontSize: 11, fontWeight: 800 }}>❓ {d} dead tap{d > 1 ? "s" : ""}</span>}
                      <span style={{ background: o.bg, color: o.col, borderRadius: 6, padding: "3px 10px", fontSize: 11.5, fontWeight: 800 }}>{o.txt}</span>
                    </div>
                  </div>
                  <div style={{ fontSize: 11.5, color: BRAND.red, fontWeight: 700, marginTop: 6 }}>{isOpen ? "Hide what they did ▲" : "Replay what they did ▼"}</div>
                </div>
                {isOpen && (
                  <div style={{ borderTop: "1px solid #F2EADB", background: "#FDFBF6", padding: "12px 14px" }}>
                    <div style={{ fontSize: 11.5, color: "#8a857a", marginBottom: 8 }}>
                      Came from {s.r && s.r !== "direct" ? s.r.replace(/^https?:\/\//, "").split("/")[0] : "a direct link or WhatsApp"} · screen {s.w}×{s.h}

                    <div style={{ display: "grid", gap: 4 }}>
                      {(s.e || []).map((x, i) => {
                        const def = EV[x[1]] || { icon: "•", label: () => x[1] };
                        const bad = typeof def.bad === "function" ? def.bad(x[2], x[3]) : def.bad;
                        const warn = typeof def.warn === "function" ? def.warn(x[2], x[3]) : def.warn;
                        return (

                            background: bad ? "#FBE9E7" : warn ? "#FFF9EC" : def.good ? "#EAF6EE" : "transparent",
                            borderRadius: 7, padding: bad || warn || def.good ? "5px 9px" : "3px 9px" }}>
                            <span style={{ color: "#a39e93", fontVariantNumeric: "tabular-nums", minWidth: 42 }}>{(x[0] / 10).toFixed(1)}s</span>
                            <span>{def.icon}</span>
                            <span style={{ color: bad ? BRAND.danger : warn ? "#8E6A1F" : def.good ? BRAND.ok : "#5c584e", fontWeight: bad || def.good ? 700 : 400 }}>
                              {def.label(x[2], x[3])}
                            </span>
                          </div>
                        );
                      })}
                      {(!s.e || !s.e.length) && <div style={{ color: "#8a857a", fontSize: 12.5 }}>No actions recorded.</div>}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
      <p style={{ fontSize: 11.5, color: "#8a857a", marginTop: 14 }}>
        What people type is never recorded — only which field they used and whether they left it empty.
      </p>
    </>
  );
}

function Riders({ settings }) {
  const base = (typeof FIREBASE_RTDB_URL !== "undefined" && FIREBASE_RTDB_URL) ? FIREBASE_RTDB_URL.replace(/\/+$/, "") : null;
  const url = base ? base + "/huntandeat/riders" : null;
  const [list, setList] = useState(null);
  const [busy, setBusy] = useState(false);
  const [nm, setNm] = useState("");
  const [ph, setPh] = useState("");
  const [err, setErr] = useState("");

  const load = async () => {
    if (!url) { setList("nodb"); return; }
    setBusy(true);
    try {
      const r = await fetch(url + ".json");
      const j = r.ok ? await r.json() : null;
      setList(j ? Object.keys(j).map((k) => ({ phone: k, ...j[k] })).sort((a, b) => (a.name || "").localeCompare(b.name || "")) : []);
    } catch (e) { setList([]); }
    setBusy(false);
  };
  useEffect(() => { load(); }, []);

  const write = async (phone, patch) => {
    await fetch(url + "/" + phone + ".json", { method: "PATCH", body: JSON.stringify(patch) });
    load();
  };
  const makeCode = () => String(Math.floor(100000 + Math.random() * 900000));

  const addRider = async () => {
    const p = ph.replace(/\D/g, "").slice(-10);
    if (!nm.trim()) return setErr("Enter the rider's name.");
    if (!/^[6-9]\d{9}$/.test(p)) return setErr("Enter a valid 10-digit mobile number.");
    setErr(""); setBusy(true);
    await write(p, { name: nm.trim(), active: true, otp: null, otpExp: null, tries: 0, token: null, addedAt: Date.now() });
    setNm(""); setPh(""); setBusy(false);
  };

  // a code is valid for 10 minutes and dies the moment it is used
  const sendOtp = async (r) => {
    const code = makeCode();
    await write(r.phone, { otp: code, otpExp: Date.now() + 10 * 60 * 1000, tries: 0 });
    const msg = encodeURIComponent(
      "Hunt & Eat delivery login\n\nYour code is " + code + "\nIt works for 10 minutes and once only.\n\nOpen the rider app and enter it with your number " + r.phone + "."
    );
    window.open("https://wa.me/91" + r.phone + "?text=" + msg, "_blank");
  };

  if (list === "nodb") return <div style={{ background: "#FFF6E5", border: "1px solid #EAD9A8", borderRadius: 10, padding: 14, fontSize: 13.5 }}>Rider logins need the database connected (FIREBASE_RTDB_URL).</div>;
  if (!list) return <div style={{ color: "#8a857a", padding: 20 }}>Loading riders…</div>;

  const liveCode = (r) => r.otp && r.otpExp && Date.now() < r.otpExp;

  return (
    <>
      <div style={{ background: "#fff", borderRadius: 12, padding: 14, marginBottom: 16, borderLeft: "4px solid " + BRAND.red }}>
        <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 2 }}>🔐 Rider logins are OTP-only</div>
        <div style={{ fontSize: 12.5, color: "#6b675e", marginBottom: 10, lineHeight: 1.6 }}>
          Only numbers listed here can open the rider app, and only with a code you send. Codes last 10 minutes,
          work once, and lock after 5 wrong tries. Pausing a rider signs them out everywhere.
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input style={{ ...inp, width: 170 }} placeholder="Rider name" value={nm} onChange={(e) => setNm(e.target.value)} />
          <input style={{ ...inp, width: 170 }} placeholder="10-digit mobile" inputMode="numeric" value={ph}
            onChange={(e) => setPh(e.target.value.replace(/\D/g, "").slice(0, 10))} />
          <button onClick={addRider} disabled={busy}
            style={{ background: BRAND.red, color: "#fff", border: "none", borderRadius: 10, padding: "10px 18px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
            + Add rider
          </button>
          <button onClick={load} style={{ background: "#fff", border: "1.5px solid " + BRAND.red, color: BRAND.red, borderRadius: 10, padding: "10px 16px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>↻ Refresh</button>
        </div>
        {err && <div style={{ color: BRAND.danger, fontSize: 12.5, fontWeight: 700, marginTop: 8 }}>{err}</div>}
      </div>

      {list.length === 0 && <div style={{ textAlign: "center", color: "#8a857a", padding: 26 }}>No riders yet. Add one above, then send them a code.</div>}
      <div style={{ display: "grid", gap: 10 }}>
        {list.map((r) => (
          <div key={r.phone} style={{ background: "#fff", borderRadius: 12, padding: 14, opacity: r.active === false ? 0.6 : 1 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <div>
                <b style={{ fontSize: 15 }}>{r.name || "—"}</b>
                {r.active === false && <span style={{ background: "#FBE9E7", color: BRAND.danger, borderRadius: 6, padding: "2px 8px", fontSize: 11, fontWeight: 800, marginLeft: 8 }}>PAUSED</span>}
                {r.token && r.active !== false && <span style={{ background: "#EAF6EE", color: BRAND.ok, borderRadius: 6, padding: "2px 8px", fontSize: 11, fontWeight: 800, marginLeft: 8 }}>SIGNED IN</span>}
                <div style={{ fontSize: 12.5, color: "#5c584e" }}>📞 {r.phone}</div>
              </div>
              <div style={{ textAlign: "right", fontSize: 11.5, color: "#8a857a" }}>
                {liveCode(r)
                  ? <span style={{ color: "#8E6A1F", fontWeight: 800 }}>Code {r.otp} · valid {Math.max(0, Math.round((r.otpExp - Date.now()) / 60000))} min</span>
                  : r.lastLogin ? "Last login " + new Date(r.lastLogin).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "Never logged in"}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
              <button onClick={() => sendOtp(r)}
                style={{ background: "#1FA855", color: "#fff", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 800, cursor: "pointer" }}>
                {liveCode(r) ? "Resend new code" : "Send login code"}
              </button>
              <button onClick={() => write(r.phone, { active: r.active === false, token: null })}
                style={{ background: "#f0ece1", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
                {r.active === false ? "Allow access" : "Pause access"}
              </button>
              <button onClick={() => window.confirm("Sign " + (r.name || r.phone) + " out of all devices?") && write(r.phone, { token: null })}
                style={{ background: "#f0ece1", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
                Sign out
              </button>
              <button onClick={async () => {
                  if (!window.confirm("Remove " + (r.name || r.phone) + " completely?")) return;
                  await fetch(url + "/" + r.phone + ".json", { method: "DELETE" }); load();
                }}
                style={{ background: "#fbe9e7", color: BRAND.danger, border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
                Remove
              </button>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

function Customers({ orders }) {

  const [wait, setWait] = useState(null);
  const dbUrl = (typeof FIREBASE_RTDB_URL !== "undefined" && FIREBASE_RTDB_URL) ? FIREBASE_RTDB_URL.replace(/\/+$/, "") : null;

  useEffect(() => {
    (async () => {
      if (!dbUrl) { setWait([]); return; }
      const out = [];
      for (let i = 89; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        try {
          const r = await fetch(dbUrl + "/" + VISIT_NS + "/waitlist/" + dkey(d) + ".json");
          const j = r.ok ? await r.json() : null;
          if (j) Object.keys(j).forEach((k) => out.push(j[k]));
        } catch {}
      }
      setWait(out.sort((a, b) => b.t - a.t));
    })();
  }, []);

  const map = {};
  orders.filter((o) => o.status !== "Cancelled").forEach((o) => {
    const k = (o.phone || "").replace(/\D/g, "").slice(-10) || o.name || "unknown";
    if (!map[k]) map[k] = { phone: k, name: o.name, addr: {}, n: 0, spend: 0, last: o.placedAt, first: o.placedAt, loc: o.loc, pincode: o.pincode, items: {} };
    const c = map[k];
    c.n++; c.spend += o.total || 0;
    if (o.address) c.addr[o.address + (o.pincode ? ", " + o.pincode : "")] = 1;
    (o.items || []).forEach((i) => { c.items[i.name] = (c.items[i.name] || 0) + i.qty; });
    if ((o.placedAt || "") > (c.last || "")) { c.last = o.placedAt; c.name = o.name; c.loc = o.loc || c.loc; c.pincode = o.pincode || c.pincode; }
    if ((o.placedAt || "") < (c.first || "")) c.first = o.placedAt;
  });
  const all = Object.keys(map).map((k) => map[k]).sort((a, b) => b.spend - a.spend);
  const s = q.trim().toLowerCase();
  const list = s ? all.filter((c) => (c.name || "").toLowerCase().includes(s) || c.phone.includes(s) || Object.keys(c.addr).join(" ").toLowerCase().includes(s)) : all;

    [["Name", "Phone", "Orders", "Total spent", "Address", "Pincode", "GPS", "First order", "Last order", "Favourite item"]].concat(
      all.map((c) => {
        const fav = Object.keys(c.items).sort((a, b) => c.items[b] - c.items[a])[0] || "";
        return [c.name, c.phone, c.n, c.spend, Object.keys(c.addr).join(" | "), c.pincode || "",
          c.loc ? c.loc.lat + "," + c.loc.lng : "", (c.first || "").slice(0, 10), (c.last || "").slice(0, 10), fav];
      })));
  const exportOrders = () => downloadCSV("orders-" + dkey(new Date()) + ".csv",
    [["Order ID", "Date", "Slot", "Name", "Phone", "Address", "Pincode", "GPS", "Items", "Amount", "Payment", "Status", "Rider"]].concat(
      orders.map((o) => [o.id, (o.placedAt || "").slice(0, 10), o.slotDate + " " + (o.slotLabel || ""), o.name, o.phone,
        o.address, o.pincode, o.loc ? o.loc.lat + "," + o.loc.lng : "",
        (o.items || []).map((i) => i.qty + "x " + i.name).join(" | "), o.total, o.pay, o.status, o.rider || ""])));
  const exportWait = () => downloadCSV("waitlist-" + dkey(new Date()) + ".csv",
    [["Date", "Phone", "Name", "Pincode", "GPS", "Area"]].concat(
      (wait || []).map((w) => [new Date(w.t).toLocaleDateString("en-IN"), w.phone, w.name || "", w.pincode || "",
        w.la ? w.la + "," + w.ln : "", w.area || ""])));

  return (
    <>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 12, marginBottom: 14 }}>
        <Stat l="Total customers" v={all.length} sub="who ordered" />
        <Stat l="Repeat customers" v={repeat} sub={all.length ? Math.round((repeat / all.length) * 100) + "% came back" : "—"} />
        <Stat l="Lifetime revenue" v={rup(revenue)} sub="all customers" />
        <Stat l="Waitlist leads" v={wait ? wait.length : "…"} sub="outside your zones" hot={!!(wait && wait.length)} />
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search name, phone or address…" style={{ ...inp, flex: 1, minWidth: 190 }} />
        <button onClick={exportCustomers} style={{ background: BRAND.ok, color: "#fff", border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer" }}>⬇ Customers CSV</button>
        <button onClick={exportOrders} style={{ background: "#241E1A", color: "#fff", border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer" }}>⬇ All orders CSV</button>
        {wait && wait.length > 0 && <button onClick={exportWait} style={{ background: BRAND.red, color: "#fff", border: "none", borderRadius: 9, padding: "9px 14px", fontWeight: 800, fontSize: 12.5, cursor: "pointer" }}>⬇ Waitlist CSV</button>}
      </div>

      <div style={{ display: "grid", gap: 9 }}>
        {list.length === 0 && <div style={{ color: "#8a857a", padding: 24, textAlign: "center" }}>No customers yet.</div>}
        {list.map((c) => {
          const fav = Object.keys(c.items).sort((a, b) => c.items[b] - c.items[a])[0];
          return (

                {c.loc && <a href={"https://www.google.com/maps?q=" + c.loc.lat + "," + c.loc.lng} target="_blank" rel="noreferrer" style={{ background: "#1a73e8", color: "#fff", borderRadius: 8, padding: "7px 13px", fontSize: 12, fontWeight: 700, textDecoration: "none" }}>📍 Map</a>}

      {wait && wait.length > 0 && (
        <>
          <h3 className="display" style={{ fontWeight: 800, fontSize: 17, margin: "22px 0 4px" }}>Waitlist — outside your delivery area</h3>
          <p style={{ fontSize: 12.5, color: "#6b675e", margin: "0 0 10px" }}>These people asked to be notified when you expand. Message them the day you add their zone.</p>
          <div style={{ display: "grid", gap: 7 }}>
            {wait.slice(0, 40).map((w, i) => (
              <div key={i} style={{ background: "#fff", borderRadius: 10, padding: "9px 13px", display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", fontSize: 12.5 }}>
                <b>{w.name || "—"}</b>
                <span>📞 {w.phone}</span>

function Demand({ zones }) {
  const [pins, setPins] = useState(null);
  const [days, setDays] = useState(30);
  const [only, setOnly] = useState("out");
  const [busy, setBusy] = useState(false);
  const boxRef = useRef(null), mapRef = useRef(null), layerRef = useRef([]);
  const [ready, setReady] = useState(false);
  const dbUrl = (typeof FIREBASE_RTDB_URL !== "undefined" && FIREBASE_RTDB_URL) ? FIREBASE_RTDB_URL.replace(/\/+$/, "") : null;

  const load = async () => {
    if (!dbUrl) { setPins("nodb"); return; }
    setBusy(true);
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = dkey(d);
      try {
        const r = await fetch(dbUrl + "/" + VISIT_NS + "/pins/" + key + ".json");
        const j = r.ok ? await r.json() : null;
        if (j) Object.keys(j).forEach((k) => { const p = j[k]; if (p && p.la) out.push(p); });
      } catch {}
    }
    out.sort((a, b) => b.t - a.t);
    setPins(out); setBusy(false);
  };
  useEffect(() => { load(); }, [days]);

  useEffect(() => {
    let alive = true;
    ensureLeaflet().then((L) => {
      if (!alive || !boxRef.current || mapRef.current) return;
      const map = L.map(boxRef.current).setView([12.9, 80.08], 11);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
      mapRef.current = map; setReady(true);
      setTimeout(() => map.invalidateSize(), 250);
    }).catch(() => {});
    return () => { alive = false; if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, []);

  const shown = Array.isArray(pins) ? pins.filter((p) => (only === "out" ? !p.in : only === "in" ? p.in : true)) : [];

  useEffect(() => {
    if (!ready || !mapRef.current || !window.L || !Array.isArray(pins)) return;
    const L = window.L, map = mapRef.current;
    layerRef.current.forEach((l) => map.removeLayer(l));
    layerRef.current = [];
    (zones || []).filter((z) => z.active !== false).forEach((z) => {
      const style = { color: "#177245", weight: 2, fillColor: "#2E8B57", fillOpacity: .07 };
      const layer = (z.shape === "poly" && z.points && z.points.length >= 3)
        ? L.polygon(z.points.map((p) => [p.lat, p.lng]), style)
        : (z.lat ? L.circle([z.lat, z.lng], { ...style, radius: (z.radiusKm || 1) * 1000 }) : null);
      if (layer) { layer.addTo(map); layerRef.current.push(layer); }
    });
    shown.forEach((p) => {
      const c = L.circleMarker([p.la, p.ln], {
        radius: p.b ? 8 : 6, color: p.in ? "#177245" : "#C0392B", weight: 2,
        fillColor: p.in ? "#2E8B57" : "#E74C3C", fillOpacity: p.b ? .9 : .55,
      }).addTo(map).bindPopup(
        (p.in ? "✅ Inside zone" : "❌ Outside — " + (p.d != null ? p.d + " km away" : "")) +
        (p.b ? "<br><b>Tried to order (blocked)</b>" : "") +
        (p.pc ? "<br>Pincode: " + p.pc : "") +
        "<br>" + new Date(p.t).toLocaleString("en-IN") +
        '<br><a href="https://www.google.com/maps?q=' + p.la + "," + p.ln + '" target="_blank">Open in Google Maps</a>'
      );
      layerRef.current.push(c);
    });
    if (shown.length) {
      try { map.fitBounds(L.latLngBounds(shown.map((p) => [p.la, p.ln])), { padding: [30, 30], maxZoom: 14 }); } catch {}
    }
  }, [pins, only, ready, zones]);

  if (pins === "nodb") return <div style={{ background: "#FFF6E5", border: "1px solid #EAD9A8", borderRadius: 10, padding: 14, fontSize: 13.5 }}>Needs the database connected.</div>;

  const outs = Array.isArray(pins) ? pins.filter((p) => !p.in) : [];
  const blocked = outs.filter((p) => p.b);
  // group nearby rejected pins (~1.1 km grid) to reveal demand clusters
  const grid = {};
  outs.forEach((p) => {
    const k = Math.round(p.la * 100) / 100 + "," + Math.round(p.ln * 100) / 100;
    (grid[k] = grid[k] || []).push(p);
  });
  const clusters = Object.keys(grid).map((k) => ({ k, list: grid[k] })).sort((a, b) => b.list.length - a.list.length).slice(0, 8);

  return (
    <>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 12, marginBottom: 14 }}>
        <Stat l="Outside-zone pins" v={outs.length} sub={"last " + days + " days"} hot={outs.length > 0} />
        <Stat l="Tried to order" v={blocked.length} sub="blocked by geofence" hot={blocked.length > 0} />
        <Stat l="Inside-zone pins" v={Array.isArray(pins) ? pins.length - outs.length : 0} sub="served area" />
        <Stat l="Demand clusters" v={clusters.length} sub="areas worth adding" />
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10, alignItems: "center" }}>
        {[["out", "❌ Outside only"], ["in", "✅ Inside only"], ["all", "All pins"]].map(([v, l]) => (
          <button key={v} onClick={() => setOnly(v)} style={{ background: only === v ? BRAND.red : "#fff", color: only === v ? "#fff" : BRAND.ink, border: "1px solid #e5dfd0", borderRadius: 999, padding: "6px 13px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>{l}</button>
        ))}
        <select value={days} onChange={(e) => setDays(Number(e.target.value))} style={{ ...inp, width: "auto", padding: "6px 10px", fontSize: 12.5, fontWeight: 700 }}>
          <option value={7}>Last 7 days</option><option value={30}>Last 30 days</option><option value={90}>Last 90 days</option>
        </select>
        <button onClick={load} style={{ marginLeft: "auto", background: "#fff", border: "1.5px solid " + BRAND.red, color: BRAND.red, borderRadius: 8, padding: "6px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>{busy ? "…" : "↻ Refresh"}</button>
      </div>

      <div ref={boxRef} style={{ height: 330, borderRadius: 12, overflow: "hidden", border: "1px solid #E5DFD0", background: "#EFEAE0" }} />

      <h3 className="display" style={{ fontWeight: 800, fontSize: 17, margin: "20px 0 8px" }}>Best areas to expand into</h3>
      <div style={{ display: "grid", gap: 8 }}>
        {clusters.length === 0 && <div style={{ color: "#8a857a", fontSize: 13 }}>No rejected locations recorded yet.</div>}
        {clusters.map((c) => {
          const p = c.list[0];
          const tried = c.list.filter((x) => x.b).length;
          const pc = {}; c.list.forEach((x) => { if (x.pc) pc[x.pc] = (pc[x.pc] || 0) + 1; });
          const topPc = Object.keys(pc).sort((a, b) => pc[b] - pc[a])[0];
          return (
            <div key={c.k} style={{ background: "#fff", borderRadius: 10, padding: "11px 14px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <div style={{ flex: 1, minWidth: 180 }}>
                <b style={{ fontSize: 14 }}>{c.list.length} request{c.list.length > 1 ? "s" : ""}{topPc ? " · pincode " + topPc : ""}</b>
                <div style={{ fontSize: 12, color: "#8a857a" }}>
                  {tried ? tried + " tried to order · " : ""}nearest zone {p.z || "—"} · about {p.d} km away

              <a href={"https://www.google.com/maps?q=" + p.la + "," + p.ln} target="_blank" rel="noreferrer"
                style={{ background: "#1a73e8", color: "#fff", borderRadius: 8, padding: "7px 13px", fontSize: 12, fontWeight: 700, textDecoration: "none" }}>📍 View area</a>
            </div>
          );
        })}
      </div>

      <h3 className="display" style={{ fontWeight: 800, fontSize: 17, margin: "20px 0 8px" }}>Recent pins</h3>
      <div style={{ display: "grid", gap: 6 }}>
        {shown.slice(0, 25).map((p, i) => (
          <div key={i} style={{ background: "#fff", borderRadius: 9, padding: "8px 12px", display: "flex", gap: 10, alignItems: "center", fontSize: 12.5, flexWrap: "wrap" }}>
            <span>{p.in ? "✅" : "❌"}</span>
            <span style={{ fontWeight: 700 }}>{p.la}, {p.ln}</span>
            {p.pc ? <span style={{ color: "#8a857a" }}>· {p.pc}</span> : null}
            {p.b ? <span style={{ background: "#FBE9E7", color: BRAND.danger, borderRadius: 6, padding: "2px 8px", fontWeight: 800, fontSize: 11 }}>tried to order</span> : null}
            <span style={{ color: "#8a857a", marginLeft: "auto" }}>{new Date(p.t).toLocaleDateString("en-IN", { day: "numeric", month: "short" })}</span>
            <a href={"https://www.google.com/maps?q=" + p.la + "," + p.ln} target="_blank" rel="noreferrer" style={{ color: "#1a73e8", fontWeight: 700 }}>Map</a>
          </div>
        ))}
      </div>
    </>
  );
}

function Cash({ orders, saveOrders }) {
  const [date, setDate] = useState(dkey(new Date()));
  const delivered = orders.filter((o) => o.status === "Delivered");
  const codAll = delivered.filter((o) => o.pay === "cod");
  const pendingAll = codAll.filter((o) => !o.cashSettled);
  const dayOrders = delivered.filter((o) => o.slotDate === date);
  const dayCod = dayOrders.filter((o) => o.pay === "cod");
  const dayUpi = dayOrders.filter((o) => o.pay !== "cod");
  const sum = (l) => l.reduce((s, o) => s + o.total, 0);

  const riderKey = (o) => ((o.rider || "").trim() || "Unassigned");
  const groups = {};
  pendingAll.forEach((o) => { const k = riderKey(o); (groups[k] = groups[k] || []).push(o); });

  const collect = (k, list) => {
    const amt = sum(list);
    if (!window.confirm(`Confirm you received ${rup(amt)} cash from ${k} for ${list.length} order(s)?`)) return;
    const ids = {}; list.forEach((o) => { ids[o.id] = 1; });
    const at = new Date().toISOString();
    saveOrders(orders.map((o) => (ids[o.id] ? { ...o, cashSettled: true, settledAt: at } : o)));
  };

  // settlement history: group settled orders by settlement day + rider
  const hist = {};
  codAll.filter((o) => o.cashSettled).forEach((o) => {
    const d = o.settledAt ? dkey(new Date(o.settledAt)) : o.slotDate;
    const k = d + "||" + riderKey(o);
    (hist[k] = hist[k] || []).push(o);
  });
  const histRows = Object.keys(hist).sort().reverse().slice(0, 25);

  const undo = (list) => {
    if (!window.confirm("Undo this collection? The amount goes back to pending.")) return;
    const ids = {}; list.forEach((o) => { ids[o.id] = 1; });
    saveOrders(orders.map((o) => (ids[o.id] ? { ...o, cashSettled: false, settledAt: null } : o)));
  };

  return (
    <>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))", gap: 12, marginBottom: 16 }}>
        <Stat l="Cash pending from riders" v={rup(sum(pendingAll))} sub={`${pendingAll.length} order(s), all dates`} hot={pendingAll.length > 0} />
        <Stat l="Cash orders on this date" v={rup(sum(dayCod))} sub={`${dayCod.length} COD delivered`} />
        <Stat l="UPI on this date" v={rup(sum(dayUpi))} sub={`${dayUpi.length} paid online`} />
        <Stat l="Total collected on date" v={rup(sum(dayOrders))} sub="cash + UPI" />
      </div>

      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 16, flexWrap: "wrap" }}>
        <span style={{ fontSize: 13, fontWeight: 700 }}>Date:</span>
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ ...inp, width: "auto", padding: "8px 12px", fontSize: 13 }} />
        <button onClick={() => setDate(dkey(new Date()))} style={{ background: "#fff", border: "1.5px solid " + BRAND.red, color: BRAND.red, borderRadius: 8, padding: "8px 14px", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>Today</button>
      </div>

      <h3 className="display" style={{ fontWeight: 800, fontSize: 17, margin: "0 0 8px" }}>Cash to collect from riders</h3>
      {Object.keys(groups).length === 0 && (
        <div style={{ background: "#EAF6EE", border: "1px solid #BEDFC8", color: "#177245", borderRadius: 10, padding: 14, fontSize: 13.5, fontWeight: 700 }}>
          ✓ All cash settled — nothing pending from any rider.
        </div>
      )}
      <div style={{ display: "grid", gap: 10 }}>
        {Object.keys(groups).sort().map((k) => {
          const list = groups[k].slice().sort((a, b) => (a.slotDate < b.slotDate ? -1 : 1));
          const dates = Array.from(new Set(list.map((o) => o.slotDate))).sort();
          return (
            <div key={k} style={{ background: "#fff", borderRadius: 12, padding: 14, borderLeft: "4px solid #B98A2E" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                <div>
                  <div style={{ fontWeight: 800, fontSize: 15 }}>🛵 {k}</div>
                  <div style={{ fontSize: 12, color: "#8a857a" }}>{list.length} COD order(s) · {dates.join(", ")}</div>
                </div>
                <div className="display" style={{ fontSize: 22, fontWeight: 800, color: "#8E6A1F" }}>{rup(sum(list))}</div>
              </div>
              <div style={{ fontSize: 12, color: "#5c584e", margin: "8px 0" }}>
                {list.map((o) => `${o.id} (${rup(o.total)})`).join(" · ")}
              </div>
              <button onClick={() => collect(k, list)}
                style={{ width: "100%", background: BRAND.ok, color: "#fff", border: "none", borderRadius: 10, padding: 11, fontWeight: 800, fontSize: 14, cursor: "pointer" }}>
                ✓ Collected {rup(sum(list))} from {k}
              </button>
            </div>
          );
        })}
      </div>

      <h3 className="display" style={{ fontWeight: 800, fontSize: 17, margin: "22px 0 8px" }}>Collection history</h3>
      {histRows.length === 0 && <div style={{ color: "#8a857a", fontSize: 13 }}>No collections recorded yet.</div>}
      <div style={{ display: "grid", gap: 8 }}>
        {histRows.map((k) => {
          const list = hist[k];
          const [d, r] = k.split("||");
          return (
            <div key={k} style={{ background: "#fff", borderRadius: 10, padding: "10px 14px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", fontSize: 13 }}>
              <span style={{ fontWeight: 700 }}>✅ {d}</span>
              <span>· {r}</span>
              <span style={{ color: "#8a857a" }}>· {list.length} order(s)</span>
              <b style={{ marginLeft: "auto", color: BRAND.ok }}>{rup(list.reduce((s, o) => s + o.total, 0))}</b>
              <button onClick={() => undo(list)} style={{ background: "#f0ece1", border: "none", borderRadius: 7, padding: "5px 10px", fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}>Undo</button>
            </div>
          );
        })}
      </div>
    </>
  );
}

function CatManager({ cats, products, onSave, close }) {
  const [list, setList] = useState(cats.map((c) => ({ ...c })));
  const upd = (i, patch) => setList(list.map((c, j) => (j === i ? { ...c, ...patch } : c)));
  const move = (i, dir) => {
    const j = i + dir; if (j < 0 || j >= list.length) return;
    const n = [...list]; const tmp = n[i]; n[i] = n[j]; n[j] = tmp; setList(n);
  };
  const del = (i) => {
    const c = list[i];
    const used = products.filter((p) => p.cat === c.id).length;
    if (used) return alert(`${used} menu item(s) still use "${c.name}". Move them to another category first, then delete this one.`);
    if (window.confirm(`Delete category "${c.name}"?`)) setList(list.filter((_, j) => j !== i));
  };
  const saveAll = () => {
    const clean = list.filter((c) => (c.name || "").trim()).map((c) => ({ id: c.id, name: c.name.trim(), ta: (c.ta || "").trim(), icon: (c.icon || "🍽️").trim(), zoneFree: !!c.zoneFree }));
    if (!clean.length) return alert("Keep at least one category.");
    onSave(clean);
  };
  const btn = { background: "#f0ece1", border: "none", borderRadius: 7, width: 28, height: 28, cursor: "pointer", fontWeight: 800, fontSize: 13 };
  return (
    <Modal close={close}>
      <h3 className="display" style={{ fontWeight: 800, margin: "0 0 4px" }}>Manage categories</h3>
      <p style={{ fontSize: 12.5, color: "#6b675e", margin: "0 0 12px" }}>
        Rename freely — items stay linked. Use ▲▼ to set the order customers see on the store.
        Tick <b>Delivers all over India</b> on a category of shelf-stable items (pickles, podi, masala, dry fish).
        Customers outside your delivery zone can order from those categories only — fresh meat stays local.
      </p>
      <div style={{ display: "grid", gap: 8 }}>
        {list.map((c, i) => (
          <div key={c.id} style={{ display: "flex", gap: 6, alignItems: "center", background: "#FBF7EF", borderRadius: 10, padding: 8 }}>
            <input value={c.icon} onChange={(e) => upd(i, { icon: e.target.value })} title="Emoji"
              style={{ ...inp, width: 46, textAlign: "center", padding: "8px 4px", fontSize: 17 }} />
            <div style={{ flex: 1, display: "grid", gap: 4 }}>
              <input value={c.name} onChange={(e) => upd(i, { name: e.target.value })} placeholder="Category name"
                style={{ ...inp, padding: "7px 10px", fontSize: 13, fontWeight: 700 }} />
              <input value={c.ta || ""} onChange={(e) => upd(i, { ta: e.target.value })} placeholder="Tamil name (optional)"
                style={{ ...inp, padding: "7px 10px", fontSize: 12.5 }} />
              <label style={{ display: "flex", gap: 7, alignItems: "center", fontSize: 12, fontWeight: 700, cursor: "pointer", color: c.zoneFree ? BRAND.ok : "#6b675e" }}>
                <input type="checkbox" checked={!!c.zoneFree} onChange={() => upd(i, { zoneFree: !c.zoneFree })} />
                📦 Delivers all over India (outside our zone too)
              </label>
            </div>
            <div style={{ display: "grid", gap: 3 }}>
              <button onClick={() => move(i, -1)} style={btn}>▲</button>
              <button onClick={() => move(i, 1)} style={btn}>▼</button>
            </div>
            <button onClick={() => del(i)} style={{ ...btn, background: "#fbe9e7", color: BRAND.danger, width: 34 }}>✕</button>
          </div>
        ))}
      </div>
      <button onClick={() => setList([...list, { id: "c" + Date.now(), name: "", ta: "", icon: "🍽️" }])}
        style={{ width: "100%", marginTop: 10, background: "#fff", border: "1.5px dashed " + BRAND.red, color: BRAND.red, borderRadius: 10, padding: 11, fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
        + Add category
      </button>
      <button onClick={saveAll} style={{ width: "100%", marginTop: 8, background: BRAND.red, color: "#fff", border: "none", borderRadius: 10, padding: 12, fontWeight: 800, cursor: "pointer" }}>
        Save & publish categories
      </button>
    </Modal>
  );
}

/* ---------------- Menu (with photo upload) ---------------- */
function Menu({ products, save, cats, saveCats }) {
  const [catOpen, setCatOpen] = useState(false);
  const empty = { id: "", cat: (cats[0] && cats[0].id) || "chicken", name: "", pcs: "", gross: "—", net: "—", mrp: "", price: "", stock: true, emoji: "🍗", desc: "", img: "" };
  const [edit, setEdit] = useState(null);
  const [uploading, setUploading] = useState(false);
  const fileRef = useRef(null);

  const onFile = async (file) => {
    if (!file || !file.type.startsWith("image/")) return;
    setUploading(true);
    try {
      const dataUrl = await compressImage(file);
      setEdit((e) => ({ ...e, img: dataUrl }));
    } catch { alert("Couldn't read that image. Try a JPG or PNG."); }
    setUploading(false);
  };

  const saveProduct = () => {
    if (!edit.name || !edit.price) return;
    const p = { ...edit, mrp: Number(edit.mrp || edit.price), price: Number(edit.price) };
    if (p.id) save(products.map((x) => (x.id === p.id ? p : x)));
    else save([...products, { ...p, id: "p" + Date.now() }]);
    setEdit(null);
  };

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
        <p style={{ fontSize: 13, color: "#6b675e", margin: 0 }}>Changes here go live on the customer store on their next visit or refresh.</p>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setCatOpen(true)} style={{ background: "#fff", color: BRAND.red, border: "1.5px solid " + BRAND.red, borderRadius: 10, padding: "10px 16px", fontWeight: 700, cursor: "pointer" }}>🗂️ Categories</button>
          <button onClick={() => setEdit(empty)} style={{ background: BRAND.red, color: "#fff", border: "none", borderRadius: 10, padding: "10px 18px", fontWeight: 700, cursor: "pointer" }}>+ Add item</button>
        </div>
      </div>
      <div style={{ display: "grid", gap: 8 }}>
        {products.map((p) => (
          <div key={p.id} style={{ background: "#fff", borderRadius: 10, padding: "10px 14px", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
            <div style={{ width: 48, height: 48, borderRadius: 8, overflow: "hidden", flexShrink: 0, background: BRAND.creamSoft, display: "grid", placeItems: "center", fontSize: 24 }}>
              {p.img ? <img src={p.img} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : p.emoji}
            </div>
            <div style={{ flex: 1, minWidth: 160 }}>
              <div style={{ fontWeight: 600, fontSize: 14 }}>{p.name}</div>
              <div style={{ fontSize: 12, color: "#8a857a" }}>
                {(cats.find((c) => c.id === p.cat) || {}).name || p.cat}
                {(cats.find((c) => c.id === p.cat) || {}).zoneFree ? <span style={{ color: BRAND.ok, fontWeight: 700 }}> · 📦 All India</span> : null} · {rup(p.price)} <s style={{ opacity: .6 }}>{rup(p.mrp)}</s> {p.img ? "· 📷 photo set" : "· no photo"}</div>
            </div>
            <label style={{ fontSize: 12, fontWeight: 600, display: "flex", gap: 5, alignItems: "center", cursor: "pointer" }}>
              <input type="checkbox" checked={p.stock} onChange={() => save(products.map((x) => x.id === p.id ? { ...x, stock: !x.stock } : x))} /> In stock
            </label>
            <button onClick={() => setEdit(p)} style={{ background: "#f0ece1", border: "none", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>Edit</button>
            <button onClick={() => window.confirm(`Delete "${p.name}"?`) && save(products.filter((x) => x.id !== p.id))} style={{ background: "#fbe9e7", color: BRAND.danger, border: "none", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>Delete</button>
          </div>
        ))}
      </div>

      {edit && (
        <Modal close={() => setEdit(null)}>
          <h3 className="display" style={{ fontWeight: 800, margin: "0 0 12px" }}>{edit.id ? "Edit menu item" : "New menu item"}</h3>

          {/* photo upload */}
          <div
            onDragOver={(e) => e.preventDefault()}
            onDrop={(e) => { e.preventDefault(); onFile(e.dataTransfer.files[0]); }}
            onClick={() => fileRef.current?.click()}
            style={{ border: "2px dashed " + BRAND.red, borderRadius: 12, padding: 12, textAlign: "center", cursor: "pointer", marginBottom: 10, background: "#FDF7F1" }}>
            {edit.img ? (
              <img src={edit.img} alt="preview" style={{ width: "100%", maxHeight: 160, objectFit: "cover", borderRadius: 8 }} />
            ) : (
              <div style={{ color: BRAND.red, fontWeight: 700, fontSize: 13, padding: "14px 0" }}>
                📷 {uploading ? "Processing photo…" : "Tap to upload a photo (or drag & drop)"}
                <div style={{ fontWeight: 500, color: "#8a857a", fontSize: 12, marginTop: 4 }}>Photos are auto-resized so the store stays fast</div>
              </div>
            )}
            <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => onFile(e.target.files[0])} />
          </div>
          {edit.img && (

              <button onClick={() => setEdit({ ...edit, img: "" })} style={{ flex: 1, background: "#fbe9e7", color: BRAND.danger, border: "none", borderRadius: 8, padding: 8, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>Remove photo</button>
