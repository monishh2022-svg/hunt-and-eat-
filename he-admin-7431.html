            </select>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              <input style={inp} placeholder="Selling price ₹" type="number" value={edit.price} onChange={(e) => setEdit({ ...edit, price: e.target.value })} />
              <input style={inp} placeholder="MRP ₹" type="number" value={edit.mrp} onChange={(e) => setEdit({ ...edit, mrp: e.target.value })} />
              <input style={inp} placeholder="Pieces (e.g. 12–14 Pcs)" value={edit.pcs} onChange={(e) => setEdit({ ...edit, pcs: e.target.value })} />
              <input style={inp} placeholder="Fallback emoji" value={edit.emoji} onChange={(e) => setEdit({ ...edit, emoji: e.target.value })} />
              <input style={inp} placeholder="Gross weight" value={edit.gross} onChange={(e) => setEdit({ ...edit, gross: e.target.value })} />
              <input style={inp} placeholder="Net weight" value={edit.net} onChange={(e) => setEdit({ ...edit, net: e.target.value })} />
            </div>
            <input style={inp} placeholder="Or paste an image URL" value={(edit.img || "").startsWith("data:") ? "" : edit.img} onChange={(e) => setEdit({ ...edit, img: e.target.value })} />
            <textarea style={{ ...inp, resize: "vertical" }} rows={2} placeholder="Short description" value={edit.desc} onChange={(e) => setEdit({ ...edit, desc: e.target.value })} />
            <button onClick={saveProduct} style={{ background: BRAND.red, color: "#fff", border: "none", borderRadius: 10, padding: 12, fontWeight: 700, cursor: "pointer" }}>Save & publish to store</button>
          </div>
        </Modal>
      )}
      {catOpen && <CatManager cats={cats} products={products} close={() => setCatOpen(false)}
        onSave={(c) => { saveCats(c); setCatOpen(false); }} />}
    </>
  );
}

/* ---------------- Slots ---------------- */
function Slots({ slots, save }) {
  const [draft, setDraft] = useState(slots);
  const [dirty, setDirty] = useState(false);
  useEffect(() => { if (!dirty) setDraft(slots); }, [slots, dirty]);

  const apply = (list) => { setDraft(list); setDirty(false); save(list); };           // instant actions
  const edit = (id, patch) => { setDraft(draft.map((s) => (s.id === id ? { ...s, ...patch } : s))); setDirty(true); }; // typing
  const commit = () => {
    if (!dirty) return;
    apply(draft.map((s) => ({ ...s, capacity: Math.max(1, parseInt(s.capacity, 10) || 1) })));
  };

  return (
    <>
      <p style={{ fontSize: 13, color: "#6b675e" }}>Same-day slots auto-close before the slot starts (cut-off set in Settings). Toggle a slot off to hide it from customers. Capacity saves when you click away, or use the Save button.</p>
      <div style={{ display: "grid", gap: 8 }}>
        {draft.map((s) => (
          <div key={s.id} style={{ background: "#fff", borderRadius: 10, padding: "12px 14px", display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
            <b style={{ flex: 1, minWidth: 150 }}>🕐 {s.label}</b>
            <label style={{ fontSize: 13, display: "flex", gap: 6, alignItems: "center" }}>
              Capacity
              <input type="text" inputMode="numeric" value={s.capacity}
                onChange={(e) => edit(s.id, { capacity: e.target.value.replace(/[^0-9]/g, "").slice(0, 4) })}
                onBlur={commit}
                onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
                style={{ ...inp, width: 74, padding: "6px 8px", textAlign: "center", fontWeight: 700 }} />
            </label>
            <label style={{ fontSize: 13, fontWeight: 700, display: "flex", gap: 6, alignItems: "center", cursor: "pointer", color: s.active ? BRAND.ok : BRAND.danger }}>
              <input type="checkbox" checked={s.active !== false} onChange={() => apply(draft.map((x) => (x.id === s.id ? { ...x, active: x.active === false } : x)))} />
              {s.active !== false ? "Active" : "Paused"}
            </label>
            <button onClick={() => window.confirm("Remove this slot?") && apply(draft.filter((x) => x.id !== s.id))}
              style={{ background: "#fbe9e7", color: BRAND.danger, border: "none", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>Remove</button>
          </div>
        ))}
      </div>
      {dirty && (
        <button onClick={commit} style={{ marginTop: 10, background: BRAND.ok, color: "#fff", border: "none", borderRadius: 10, padding: "10px 20px", fontWeight: 800, cursor: "pointer" }}>
          ✓ Save capacity changes
        </button>
      )}
      <button onClick={() => {
        const label = prompt("Slot label (e.g. 8:00 PM – 10:00 PM)");
        const start = Number(prompt("Start hour, 24h format (e.g. 20)"));
        if (label && !isNaN(start)) save([...slots, { id: "s" + Date.now(), label, start, capacity: 10, active: true }]);
      }} style={{ marginTop: 12, background: BRAND.red, color: "#fff", border: "none", borderRadius: 10, padding: "10px 18px", fontWeight: 700, cursor: "pointer" }}>+ Add slot</button>
    </>
  );
}

/* ---------------- Settings ---------------- */
const Field = ({ l, children }) => (
  <label style={{ display: "grid", gap: 4, fontSize: 13, fontWeight: 600 }}>{l}{children}</label>
);

function Settings({ settings, save, zones, saveZones }) {
  const [zoneOpen, setZoneOpen] = useState(false);
  const activeZones = (zones || []).filter((z) => z.active !== false);
  const [f, setF] = useState(settings);
  const [saved, setSaved] = useState(false);
  useEffect(() => setF(settings), [settings]);
  return (
    <div style={{ maxWidth: 480, display: "grid", gap: 10 }}>
      <div style={{ background: "#fff", borderRadius: 12, padding: 14, borderLeft: "4px solid " + BRAND.red }}>
        <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 2 }}>🗺️ Delivery zones (geofence)</div>
        <div style={{ fontSize: 12.5, color: "#6b675e", marginBottom: 8 }}>
          {activeZones.length
            ? `${activeZones.length} active zone(s): ${activeZones.map((z) => (z.name || "zone") + (z.shape === "poly" ? " (drawn)" : " " + z.radiusKm + "km")).join(", ")}. Orders are accepted only inside these areas.`
            : "No zones set — customers are checked by pincode only, which can include areas you don't actually serve."}
        </div>
        <button onClick={() => setZoneOpen(true)} style={{ background: BRAND.red, color: "#fff", border: "none", borderRadius: 10, padding: "10px 16px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
          {activeZones.length ? "Edit zones on map" : "Set up delivery zones"}
        </button>
      </div>
      <Field l="Delivery fee (₹)"><input style={inp} type="number" value={f.deliveryFee} onChange={(e) => setF({ ...f, deliveryFee: Number(e.target.value) })} /></Field>
      <Field l="Free delivery above (₹)"><input style={inp} type="number" value={f.freeAbove} onChange={(e) => setF({ ...f, freeAbove: Number(e.target.value) })} /></Field>
      <Field l="Serviceable pincodes (comma separated)"><input style={inp} value={f.pincodes} onChange={(e) => setF({ ...f, pincodes: e.target.value })} /></Field>
      <Field l="Store phone"><input style={inp} value={f.phone} onChange={(e) => setF({ ...f, phone: e.target.value })} /></Field>
      <Field l="Same-day slot cut-off (hours before slot)"><input style={inp} type="number" value={f.cutoffHours} onChange={(e) => setF({ ...f, cutoffHours: Number(e.target.value) })} /></Field>
      <div style={{ display: "grid", gap: 6, fontSize: 13, fontWeight: 600 }}>
        Delivery days — customers can order only for these
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d, i) => {
            const cur = f.deliveryDays && f.deliveryDays.length ? f.deliveryDays : [0];
            const sel = cur.includes(i);
            return (
              <button key={d} type="button" onClick={() => setF({ ...f, deliveryDays: sel ? cur.filter((x) => x !== i) : [...cur, i].sort((p, q) => p - q) })}
                style={{ border: "1.5px solid " + (sel ? BRAND.red : "#e5dfd0"), background: sel ? BRAND.red : "#fff", color: sel ? "#fff" : "#241E1A", borderRadius: 999, padding: "8px 14px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>{d}</button>
            );
          })}
        </div>
        <span style={{ fontWeight: 500, fontSize: 12, color: "#8a857a" }}>Sunday-only delivery? Keep just Sun selected. Customers will see only your open days.</span>
      </div>
      <Field l="How many days ahead customers can book"><input style={inp} type="number" min={1} max={30} value={f.daysAhead ?? 14} onChange={(e) => setF({ ...f, daysAhead: Number(e.target.value) || 14 })} /></Field>
      <Field l="Admin PIN"><input style={inp} value={f.adminPin} onChange={(e) => setF({ ...f, adminPin: e.target.value })} /></Field>
      <button onClick={() => { save(f); setSaved(true); setTimeout(() => setSaved(false), 1500); }} style={{ background: BRAND.red, color: "#fff", border: "none", borderRadius: 10, padding: 12, fontWeight: 700, cursor: "pointer" }}>
        {saved ? "✓ Saved & published" : "Save settings"}
      </button>
      {zoneOpen && <ZoneEditor zones={zones} close={() => setZoneOpen(false)} onSave={(z) => { saveZones(z); setZoneOpen(false); }} />}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<AdminApp />);
</script>
</body>
</html>
