let __ac = null;
function audioCtx() {

async function saveOrders(list) {
  const r = await fetch(RTDB + "/huntandeat/huntandeat-orders.json", { method: "PUT", body: JSON.stringify(JSON.stringify(list)) });
  if (!r.ok) throw new Error("write failed");
}

/* ---------- rider accounts: the shop issues an OTP, the app verifies it ---------- */
const RIDERS_URL = RTDB + "/huntandeat/riders";

async function getRider(phone) {
  const r = await fetch(RIDERS_URL + "/" + phone + ".json");
  if (!r.ok) throw new Error("read failed");
  return await r.json();
}
async function patchRider(phone, patch) {
  const r = await fetch(RIDERS_URL + "/" + phone + ".json", { method: "PATCH", body: JSON.stringify(patch) });
  if (!r.ok) throw new Error("write failed");
}
function newToken() {
  return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function readSession() {
  try { return JSON.parse(localStorage.getItem("he-rider-session") || "null"); } catch (e) { return null; }
}

function App() {
  const saved = readSession();
  const [phone, setPhone] = useState(saved ? saved.phone : "");
  const [entered, setEntered] = useState(false);
  const [checking, setChecking] = useState(!!saved);
  const [step, setStep] = useState("phone");   // phone -> otp -> in
  const [otp, setOtp] = useState("");
  const [riderName, setRiderName] = useState(saved ? saved.name || "" : "");
  const [loginErr, setLoginErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [sentAt, setSentAt] = useState(0);

  const signOut = () => {
    try { localStorage.removeItem("he-rider-session"); } catch (e) {}
    setEntered(false); setStep("phone"); setOtp(""); setLoginErr(""); setPhone("");
  };

  // a saved session is only trusted if the shop still recognises this token
  useEffect(() => {
    if (!saved) return;
    (async () => {
      try {
        const r = await getRider(saved.phone);
        if (r && r.active !== false && r.token && r.token === saved.token) {
          setRiderName(r.name || ""); setEntered(true); setStep("in");
        } else {
          try { localStorage.removeItem("he-rider-session"); } catch (e) {}
        }
      } catch (e) {
        setLoginErr("Can't reach the shop right now — check your internet and try again.");
      }
      setChecking(false);
    })();
  }, []);

  // step 1: the shop must already know this number
  const askOtp = async () => {
    setLoginErr("");
    if (digits.length !== 10) return setLoginErr("Enter your 10-digit mobile number.");
    setBusy(true);
    try {
      const r = await getRider(digits);
      if (!r) { setBusy(false); return setLoginErr("This number isn't registered. Ask the shop to add you as a delivery partner."); }
      if (r.active === false) { setBusy(false); return setLoginErr("Your access has been paused. Please contact the shop."); }
      // the shop decides WHO may log in; the OTP only proves they hold the number
      if (SMS_ON) {
        try {
          if (!window.__verifier) {
            window.__verifier = new firebase.auth.RecaptchaVerifier("recaptcha-host", { size: "invisible" });
          }
          window.__confirm = await __auth.signInWithPhoneNumber("+91" + digits, window.__verifier);
          setRiderName(r.name || ""); setSentAt(Date.now()); setStep("otp");
        } catch (e) {
          const code = (e && e.code) || "";
          if (code === "auth/too-many-requests") setLoginErr("Too many attempts from this number. Wait a few minutes and try again.");
          else if (code === "auth/invalid-phone-number") setLoginErr("That number isn't valid for SMS.");
          else if (code === "auth/quota-exceeded") setLoginErr("Daily SMS limit reached. Ask the shop to send your code on WhatsApp instead.");
          else setLoginErr("Couldn't send the SMS. Ask the shop to send your code on WhatsApp instead.");
          try { if (window.__verifier) { window.__verifier.clear(); window.__verifier = null; } } catch (e2) {}
        }
        setBusy(false);
        return;
      }
      if (!r.otp || !r.otpExp || Date.now() > r.otpExp) {
        setBusy(false);
        return setLoginErr("No valid code for you right now. Ask the shop to send a fresh OTP on WhatsApp.");
      }
      setRiderName(r.name || ""); setSentAt(Date.now()); setStep("otp");
    } catch (e) {
      setLoginErr("Can't reach the shop right now — check your internet.");
    }
    setBusy(false);
  };

  // step 2: verify, then swap the one-time code for a session token
  const verifyOtp = async () => {
    setLoginErr("");
    const code = otp.replace(/\D/g, "");
    if (code.length !== 6) return setLoginErr("Enter the 6-digit code the shop sent you.");
    setBusy(true);
    try {
      const r = await getRider(digits);
      if (!r || r.active === false) { setBusy(false); return setLoginErr("Your access is not active. Please contact the shop."); }

      if (SMS_ON) {
        try {
          await window.__confirm.confirm(code);
        } catch (e) {
          const ec = (e && e.code) || "";
          setBusy(false);
          if (ec === "auth/invalid-verification-code") return setLoginErr("That code is wrong. Check the SMS and try again.");
          if (ec === "auth/code-expired") return setLoginErr("That code has expired. Tap Change number and start again.");
          return setLoginErr("Couldn't verify that code. Please try again.");
        }
        const tok = newToken();
        await patchRider(digits, { tries: 0, token: tok, lastLogin: Date.now() });
        try { localStorage.setItem("he-rider-session", JSON.stringify({ phone: digits, token: tok, name: r.name || "" })); } catch (e) {}
        audioCtx(); playTone(0.15);
        setRiderName(r.name || ""); setEntered(true); setStep("in"); setBusy(false);
        return;
      }

      if (!r.otp || !r.otpExp || Date.now() > r.otpExp) { setBusy(false); return setLoginErr("That code has expired. Ask the shop for a new one."); }
      if ((r.tries || 0) >= 5) { setBusy(false); return setLoginErr("Too many wrong attempts. Ask the shop for a new code."); }
      if (String(r.otp) !== code) {
        await patchRider(digits, { tries: (r.tries || 0) + 1 });
        setBusy(false);
        return setLoginErr("That code is wrong. " + (4 - (r.tries || 0)) + " attempt(s) left.");
      }
      const token = newToken();
      // code is burned on use, so it can never be replayed
      await patchRider(digits, { otp: null, otpExp: null, tries: 0, token: token, lastLogin: Date.now() });
      try { localStorage.setItem("he-rider-session", JSON.stringify({ phone: digits, token: token, name: r.name || "" })); } catch (e) {}
      audioCtx(); playTone(0.15);
      setRiderName(r.name || ""); setEntered(true); setStep("in");
    } catch (e) {
      setLoginErr("Can't reach the shop right now — check your internet.");
    }
    setBusy(false);
  };
  const [orders, setOrders] = useState([]);
  const [last, setLast] = useState(null);
  const [err, setErr] = useState("");

  const refresh = async () => {
    try { setOrders(await loadOrders()); setLast(new Date()); setErr(""); }
    catch { setErr("Can't reach the database — check internet."); }
  };
  useEffect(() => {
    if (!entered) return;
    refresh();
    const t = setInterval(refresh, 12000);
    return () => clearInterval(t);
  }, [entered]);

  const digits = phone.replace(/\D/g, "").slice(-10);
  const mine = orders.filter((o) => ((o.rider || "").replace(/\D/g, "")).includes(digits) && digits.length === 10);
  const active = mine.filter((o) => o.status !== "Delivered" && o.status !== "Cancelled");
  const doneToday = mine.filter((o) => o.status === "Delivered" && o.slotDate === dkey(new Date()));
  const cashToday = doneToday.filter((o) => o.pay === "cod").reduce((s, o) => s + o.total, 0);
  const cashInHand = mine.filter((o) => o.status === "Delivered" && o.pay === "cod" && !o.cashSettled).reduce((s, o) => s + o.total, 0);

  const prevActive = useRef(null);
  useEffect(() => {
    if (prevActive.current !== null && active.length > prevActive.current) { playTone(); if (navigator.vibrate) navigator.vibrate([220, 90, 220]); }
    prevActive.current = active.length;
  }, [active.length]);

  const setStatus = async (id, status) => {
    try {
      const latest = await loadOrders();
      await saveOrders(latest.map((o) => (o.id === id ? { ...o, status } : o)));
      refresh();
    } catch { alert("Couldn't update — check internet and try again."); }
  };

  if (!entered) {
    const fld = { width: "100%", padding: "12px 14px", borderRadius: 10, border: "1.5px solid #e5dfd0", fontSize: 18, textAlign: "center", boxSizing: "border-box", outline: "none", letterSpacing: 2 };
    const btn = (on) => ({ width: "100%", marginTop: 12, background: on ? BRAND.red : "#CFC9BD", color: "#fff", border: "none", borderRadius: 10, padding: 13, fontWeight: 800, fontSize: 15, cursor: on ? "pointer" : "not-allowed" });
    return (
      <div style={{ position: "fixed", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: BRAND.redDark, padding: 16, boxSizing: "border-box" }}>
        <div style={{ background: "#fff", borderRadius: 16, padding: 26, width: "min(340px,100%)", textAlign: "center", boxSizing: "border-box" }}>
          <img src={LOGO_SRC} width="72" height="72" style={{ objectFit: "contain", borderRadius: 14, display: "block", margin: "0 auto" }} alt="" />
          <h2 className="display" style={{ fontWeight: 800, margin: "8px 0 2px" }}>Hunt &amp; Eat Rider</h2>
          <div style={{ fontSize: 9, letterSpacing: 2.5, fontWeight: 700, color: BRAND.red, marginBottom: 14 }}>DELIVERY PARTNER APP</div>

          {checking ? (
            <p style={{ fontSize: 13.5, color: "#8a857a", margin: "18px 0" }}>Checking your access…</p>
          ) : step === "phone" ? (
            <>
              <p style={{ fontSize: 13, color: "#8a857a", margin: "0 0 12px" }}>
                Enter your registered mobile number. {SMS_ON ? "We'll text you a 6-digit code." : "The shop will send you a 6-digit code on WhatsApp."}
              </p>
              <input value={phone} onChange={(e) => setPhone(e.target.value.replace(/\D/g, "").slice(0, 10))}
                onKeyDown={(e) => e.key === "Enter" && askOtp()}
                placeholder="10-digit mobile number" inputMode="numeric" autoComplete="tel" style={fld} />
              <button onClick={askOtp} disabled={busy || digits.length !== 10} style={btn(!busy && digits.length === 10)}>
                {busy ? "Checking…" : "Continue"}
              </button>
            </>
          ) : (
            <>
              <p style={{ fontSize: 13, color: "#8a857a", margin: "0 0 4px" }}>
                {riderName ? "Hello " + riderName + "," : "Welcome,"} enter the 6-digit code {SMS_ON ? "texted to" : "sent to"}
              </p>
              <p style={{ fontSize: 14, fontWeight: 800, margin: "0 0 12px" }}>+91 {digits}</p>
              <input value={otp} onChange={(e) => setOtp(e.target.value.replace(/\D/g, "").slice(0, 6))}
                onKeyDown={(e) => e.key === "Enter" && verifyOtp()}
                placeholder="••••••" inputMode="numeric" autoComplete="one-time-code" maxLength={6}
                style={{ ...fld, fontSize: 26, letterSpacing: 10, fontWeight: 800 }} />
              <button onClick={verifyOtp} disabled={busy || otp.length !== 6} style={btn(!busy && otp.length === 6)}>
                {busy ? "Verifying…" : "Verify and start"}
              </button>
              <button onClick={() => { setStep("phone"); setOtp(""); setLoginErr(""); }}
                style={{ background: "none", border: "none", color: "#8a857a", fontSize: 12.5, marginTop: 10, cursor: "pointer", textDecoration: "underline" }}>
                Change number
              </button>
              <div style={{ fontSize: 11.5, color: "#a39e93", marginTop: 8, lineHeight: 1.5 }}>
                {SMS_ON ? "Didn't get the SMS? Tap Change number to send it again." : "Didn't get it? Ask the shop to resend your code."}
              </div>
            </>
          )}

          {loginErr && (
            <div style={{ background: "#FBE9E7", color: BRAND.red, borderRadius: 9, padding: "9px 11px", fontSize: 12.5, fontWeight: 700, marginTop: 12, lineHeight: 1.5 }}>
              {loginErr}
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: "#F4F0E6", fontFamily: "'Inter',sans-serif", color: BRAND.ink }}>
      <header style={{ background: BRAND.redDark, color: "#fff", padding: "12px 14px", display: "flex", alignItems: "center", gap: 10, position: "sticky", top: 0, zIndex: 10 }}>
        <img src={LOGO_SRC} width="34" height="34" style={{ objectFit: "contain", borderRadius: 8, background: BRAND.cream }} alt="" />
        <div style={{ flex: 1 }}>
          <div className="display" style={{ fontWeight: 800, fontSize: 16, lineHeight: 1 }}>{riderName || "Rider"} — {digits}</div>
          <div style={{ fontSize: 10.5, opacity: 0.8 }}>{last ? "Updated " + last.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "Connecting…"} · auto-refreshes</div>
        </div>
        <button onClick={refresh} style={{ background: BRAND.cream, color: BRAND.redDark, border: "none", borderRadius: 8, padding: "7px 12px", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>↻</button>
        <button onClick={() => window.confirm("Sign out? You'll need a new code from the shop to log back in.") && signOut()}
          style={{ background: "transparent", color: "#F3DCC0", border: "1px solid rgba(255,255,255,.35)", borderRadius: 8, padding: "7px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Exit</button>
      </header>

      <main style={{ maxWidth: 560, margin: "0 auto", padding: 14 }}>
        {err && <div style={{ background: "#FBE9E7", color: BRAND.red, borderRadius: 10, padding: 10, fontSize: 13, fontWeight: 700, marginBottom: 10 }}>{err}</div>}
        <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
          <div style={{ flex: 1, background: "#fff", borderRadius: 12, padding: "10px 14px", borderLeft: "4px solid " + BRAND.red }}>
            <div style={{ fontSize: 11, color: "#8a857a", fontWeight: 700 }}>TO DELIVER</div>
            <div className="display" style={{ fontSize: 22, fontWeight: 800 }}>{active.length}</div>
          </div>
          <div style={{ flex: 1, background: "#fff", borderRadius: 12, padding: "10px 14px", borderLeft: "4px solid " + BRAND.ok }}>
            <div style={{ fontSize: 11, color: "#8a857a", fontWeight: 700 }}>DONE TODAY</div>
            <div className="display" style={{ fontSize: 22, fontWeight: 800 }}>{doneToday.length}</div>
          </div>
          <div style={{ flex: 1.4, background: "#fff", borderRadius: 12, padding: "10px 14px", borderLeft: "4px solid #B98A2E" }}>
            <div style={{ fontSize: 11, color: "#8a857a", fontWeight: 700 }}>CASH IN HAND</div>
            <div className="display" style={{ fontSize: 22, fontWeight: 800 }}>{rup(cashInHand)}</div>
            <div style={{ fontSize: 10, color: "#8a857a" }}>to hand over · today {rup(cashToday)}</div>
          </div>
        </div>

        {digits.length === 10 && active.length === 0 && (
          <div style={{ textAlign: "center", color: "#8a857a", padding: "40px 10px", fontSize: 14 }}>
            No deliveries assigned to your number yet.<br />New orders appear here automatically when the shop assigns them to {digits}.
          </div>
        )}

        {active.map((o) => {
          const maps = o.loc ? `https://www.google.com/maps?q=${o.loc.lat},${o.loc.lng}` : `https://www.google.com/maps/search/${encodeURIComponent(o.address + " " + o.pincode)}`;
          const out = o.status === "Out for delivery";
          return (
            <div key={o.id} style={{ background: "#fff", borderRadius: 14, padding: 14, marginBottom: 12, boxShadow: "0 3px 12px rgba(94,15,24,.08)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
                <span className="display" style={{ fontWeight: 800, fontSize: 17 }}>{o.id}</span>
                <span style={{ background: o.pay === "cod" ? "#FDF1DC" : "#E8F2FD", color: o.pay === "cod" ? "#8E6A1F" : "#1a56a8", borderRadius: 8, padding: "4px 10px", fontSize: 12.5, fontWeight: 800 }}>
                  {o.pay === "cod" ? "COLLECT " + rup(o.total) + " CASH" : "UPI ON DELIVERY · " + rup(o.total)}
                </span>
              </div>
              <div style={{ fontSize: 12.5, color: "#8a857a", margin: "2px 0 6px" }}>🕐 {o.slotDate} · {o.slotLabel} · <b style={{ color: out ? "#B07A1A" : BRAND.red }}>{o.status}</b></div>
              <div style={{ fontSize: 13.5, margin: "0 0 6px" }}>{o.items.map((i) => `${i.qty}× ${i.name}`).join(" · ")}</div>
              <div style={{ fontSize: 13.5, fontWeight: 700 }}>👤 {o.name}</div>
              <div style={{ fontSize: 13, color: "#5c584e", marginBottom: 10 }}>📍 {o.address}, {o.pincode}</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                <a href={"tel:+91" + (o.phone || "").replace(/\D/g, "").slice(-10)} style={{ background: "#241E1A", color: "#fff", borderRadius: 10, padding: "11px 0", textAlign: "center", fontWeight: 800, fontSize: 14, textDecoration: "none" }}>📞 Call</a>
                <a href={maps} target="_blank" rel="noreferrer" style={{ background: "#1a73e8", color: "#fff", borderRadius: 10, padding: "11px 0", textAlign: "center", fontWeight: 800, fontSize: 14, textDecoration: "none" }}>🗺️ Navigate</a>
              </div>
              {!out ? (
                <button onClick={() => setStatus(o.id, "Out for delivery")}
                  style={{ width: "100%", background: BRAND.red, color: "#fff", border: "none", borderRadius: 10, padding: 13, fontWeight: 800, fontSize: 15, cursor: "pointer" }}>
                  🛵 Start delivery
                </button>
              ) : (
                <button onClick={() => window.confirm("Mark " + o.id + " as Delivered?") && setStatus(o.id, "Delivered")}
                  style={{ width: "100%", background: BRAND.ok, color: "#fff", border: "none", borderRadius: 10, padding: 13, fontWeight: 800, fontSize: 15, cursor: "pointer" }}>
                  ✅ Mark Delivered
                </button>
              )}
            </div>
          );
        })}
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
